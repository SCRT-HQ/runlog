<!doctype html>
<html>
  <head lang="en">
    <title>Metric Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <style>
      /* The press rows are only for a counter or a resource, and a custom
         element can style its way out of the browser's own `hidden`. */
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <sdpi-item label="Show">
      <select id="field"></select>
    </sdpi-item>

    <sdpi-item id="press-item" label="On press" hidden>
      <select id="press">
        <option value="step">+1</option>
        <option value="set">Set to</option>
      </select>
    </sdpi-item>

    <sdpi-item id="value-item" label="Set to" hidden>
      <input id="value" type="number" step="1" />
    </sdpi-item>

    <div id="runlog-account"></div>
    <script src="account.js"></script>
    <script>
      // Four fields every pack has, then whatever counters and resources the
      // attached run is keeping - those come from the plugin on every appear.
      // A counter or a resource is a key as well as a number, so those two
      // are the only fields the press rows are offered for.
      // No clock here: the Clock action is a key of its own, and a picker
      // never offers what a dedicated key does. A key already set to the
      // clock keeps drawing it; only the choice is gone. This list is
      // `FIELDS` in `src/actions/metric.ts`, which a dial turns through.
      (() => {
        const { streamDeckClient } = SDPIComponents;
        const field = document.getElementById("field");
        const press = document.getElementById("press");
        const value = document.getElementById("value");
        const pressItem = document.getElementById("press-item");
        const valueItem = document.getElementById("value-item");
        const FIXED = [
          ["score", "Score"],
          ["unit", "Unit"],
          ["latest", "Last result"],
          ["leader", "Leader"],
        ];
        let current = null;
        let onPress = { kind: "step" };

        const option = (value, label) => {
          const o = document.createElement("option");
          o.value = JSON.stringify(value);
          o.textContent = label;
          return o;
        };

        const fill = (counters, resources) => {
          field.replaceChildren(option(null, "Set up"), ...FIXED.map(([v, l]) => option(v, l)));
          for (const c of counters) field.appendChild(option({ counter: c.id }, c.label));
          for (const r of resources) field.appendChild(option({ resource: r.id }, r.label));
          show();
        };

        const show = () => {
          const chosen = JSON.stringify(current ?? null);
          const match = [...field.options].find((o) => o.value === chosen);
          if (match) field.value = match.value;
          // The fixed fields are the run's own arithmetic and take no press.
          const adjustable = current !== null && typeof current === "object";
          pressItem.hidden = !adjustable;
          valueItem.hidden = !adjustable || onPress.kind !== "set";
          press.value = onPress.kind;
          value.value = onPress.kind === "set" ? String(onPress.value) : "";
        };

        const save = () => {
          streamDeckClient.setSettings(current ? { field: current, press: onPress } : {});
          show();
        };

        field.addEventListener("change", () => {
          current = JSON.parse(field.value);
          save();
        });
        press.addEventListener("change", () => {
          onPress = press.value === "set" ? { kind: "set", value: Math.round(Number(value.value) || 0) } : { kind: "step" };
          save();
        });
        value.addEventListener("change", () => {
          onPress = { kind: "set", value: Math.round(Number(value.value) || 0) };
          save();
        });

        streamDeckClient.sendToPropertyInspector.subscribe(({ payload }) => {
          if (payload?.t === "fields") fill(payload.counters ?? [], payload.resources ?? []);
        });
        void streamDeckClient.getSettings().then(({ settings }) => {
          current = settings?.field ?? null;
          onPress = settings?.press ?? { kind: "step" };
          show();
        });
        fill([], []);
      })();
    </script>
  </body>
</html>
