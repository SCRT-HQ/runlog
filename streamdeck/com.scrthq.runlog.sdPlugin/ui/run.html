<!doctype html>
<html>
  <head lang="en">
    <title>Run Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Run">
      <select id="run"></select>
    </sdpi-item>

    <sdpi-item label="Pack">
      <select id="pack"></select>
    </sdpi-item>

    <sdpi-item label="List">
      <sdpi-button id="refresh">Refresh</sdpi-button>
    </sdpi-item>

    <div id="runlog-account"></div>
    <script src="account.js"></script>
    <script>
      // Every run the account has open, with the ones something is holding
      // marked: those are the ones a key press does anything with, and the
      // rest are runs to put this deck on before the stream starts. Picking
      // one pins it the same way pressing the key moves to it. Pinning is
      // global settings, not a per-key setting, so it goes to the plugin
      // rather than through setSettings.
      (() => {
        const { streamDeckClient } = SDPIComponents;
        const run = document.getElementById("run");
        const pack = document.getElementById("pack");
        const refresh = document.getElementById("refresh");

        const option = (value, label) => {
          const o = document.createElement("option");
          o.value = value ?? "";
          o.textContent = label;
          return o;
        };

        const name = (r) => (r.name && r.packTitle ? `${r.name} (${r.packTitle})` : (r.name ?? r.packTitle ?? r.id));
        // A run nothing is holding can still be chosen; it says so, because
        // choosing one is a deck that waits rather than a deck that presses.
        const label = (r) => (r.held === false ? `${name(r)} - not open` : name(r));

        const fill = (runs, pinned) => {
          run.replaceChildren(option(null, "None"), ...runs.map((r) => option(r.id, label(r))));
          run.value = pinned ?? "";
        };

        run.addEventListener("change", () => {
          streamDeckClient.send("sendToPlugin", { t: "pin", id: run.value || null });
        });

        refresh.addEventListener("click", () => {
          streamDeckClient.send("sendToPlugin", { t: "runs" });
        });

        // Which pack this key is for. A profile is laid out for one pack and
        // sets its Run key to that pack, so pressing Run on an Elden Ring deck
        // does not land on last night's Rocket League run. Left on every pack,
        // the key cycles them all, which is what the generic profile wants.
        const packs = (list, chosen) => {
          const known = list.some((p) => p.id === chosen);
          pack.replaceChildren(
            option(null, "Every pack"),
            ...list.map((p) => option(p.id, p.title)),
            // A key set to a pack the account no longer has still says so,
            // rather than silently reading as every pack.
            ...(chosen && !known ? [option(chosen, `${chosen} (not in your packs)`)] : []),
          );
          pack.value = chosen ?? "";
        };

        pack.addEventListener("change", () => {
          streamDeckClient.setSettings(pack.value ? { pack: pack.value } : {});
          // The picker below is filtered by this, so it is asked again.
          streamDeckClient.send("sendToPlugin", { t: "runs" });
        });

        streamDeckClient.sendToPropertyInspector.subscribe(({ payload }) => {
          if (payload?.t !== "runs") return;
          fill(payload.runs ?? [], payload.pinned ?? null);
          packs(payload.packs ?? [], payload.pack ?? "");
        });
        fill([], null);
        packs([], "");
      })();
    </script>
  </body>
</html>
