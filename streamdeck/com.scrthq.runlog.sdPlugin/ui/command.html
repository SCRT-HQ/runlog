<!doctype html>
<html>
  <head lang="en">
    <title>Command Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Command">
      <select id="command"></select>
    </sdpi-item>

    <div id="runlog-account"></div>
    <script src="account.js"></script>
    <script>
      // The commands are your library for the pack's tool, so they come from
      // the plugin on every appear rather than being listed here.
      (() => {
        const { streamDeckClient } = SDPIComponents;
        const command = document.getElementById("command");
        let current = null;

        const option = (value, label) => {
          const o = document.createElement("option");
          o.value = JSON.stringify(value);
          o.textContent = label;
          return o;
        };

        const fill = (commands) => {
          command.replaceChildren(option(null, "Set up"), ...commands.map((c) => option({ id: c.id, title: c.title }, c.title)));
          show();
        };

        // A command option is identified by its id, so a renamed setup still matches.
        const show = () => {
          const chosen = current?.id ?? null;
          const match = [...command.options].find((o) => (JSON.parse(o.value)?.id ?? null) === chosen);
          if (match) command.value = match.value;
        };

        command.addEventListener("change", () => {
          current = JSON.parse(command.value);
          streamDeckClient.setSettings(current ? { command: current } : {});
        });

        streamDeckClient.sendToPropertyInspector.subscribe(({ payload }) => {
          if (payload?.t === "commands") fill(payload.commands ?? []);
        });
        void streamDeckClient.getSettings().then(({ settings }) => {
          current = settings?.command ?? null;
          show();
        });
        fill([]);
      })();
    </script>
  </body>
</html>
