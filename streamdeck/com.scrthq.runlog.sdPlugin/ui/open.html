<!doctype html>
<html>
  <head lang="en">
    <title>Open in the browser Settings</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
  </head>

  <body>
    <sdpi-item label="Open">
      <select id="target">
        <option value="">Set up</option>
        <option value="run">The run</option>
        <option value="dock">The dock</option>
        <option value="newrun">A new run</option>
        <option value="guide">The guide</option>
        <option value="rules">The rules</option>
      </select>
    </sdpi-item>

    <sdpi-item label="Pack" id="packRow">
      <select id="pack"></select>
    </sdpi-item>

    <div id="runlog-account"></div>
    <script src="account.js"></script>
    <script>
      // Five pages, all of them at the address in the account block: the
      // run the deck is following, its dock, a new run, the guide, and the
      // pack's own rules. Handing a profile over is not here: Install a
      // profile is a key of its own, and a picker never offers what a
      // dedicated key does.
      (() => {
        const { streamDeckClient } = SDPIComponents;
        const target = document.getElementById("target");
        const pack = document.getElementById("pack");
        const packRow = document.getElementById("packRow");

        const option = (value, label) => {
          const o = document.createElement("option");
          o.value = value ?? "";
          o.textContent = label;
          return o;
        };

        // Only a new run asks which pack. The others are about the run the
        // deck is already on, or about a page that is the same page whatever
        // you are playing.
        const showPack = () => {
          packRow.style.display = target.value === "newrun" ? "" : "none";
        };

        const settings = () => ({
          ...(target.value ? { target: target.value } : {}),
          ...(target.value === "newrun" && pack.value ? { pack: pack.value } : {}),
        });

        target.addEventListener("change", () => {
          showPack();
          streamDeckClient.setSettings(settings());
        });
        pack.addEventListener("change", () => streamDeckClient.setSettings(settings()));

        const packs = (list, chosen) => {
          const known = list.some((p) => p.id === chosen);
          pack.replaceChildren(
            // No pack named lands on the shelf, where somebody with no pack in
            // mind was going anyway.
            option(null, "Ask me (the shelf)"),
            ...list.map((p) => option(p.id, p.title)),
            ...(chosen && !known ? [option(chosen, `${chosen} (not in your packs)`)] : []),
          );
          pack.value = chosen ?? "";
        };

        streamDeckClient.sendToPropertyInspector.subscribe(({ payload }) => {
          if (payload?.t === "packs") packs(payload.packs ?? [], pack.value);
        });

        void streamDeckClient.getSettings().then(({ settings: s }) => {
          target.value = s?.target ?? "";
          packs([], s?.pack ?? "");
          showPack();
        });
      })();
    </script>
  </body>
</html>
