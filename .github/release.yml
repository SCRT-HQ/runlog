# How a release's notes are put together from the pull requests in it.
#
# Titles here are written as lines in a changelog already, so the notes are
# the titles, grouped by what kind of change each was. The labels are the
# same ones that decide the size of the version bump (see CONTRIBUTING.md,
# "Releases").
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - "semver:major"
    - title: New
      labels:
        - "semver:minor"
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Everything else
      labels:
        - "*"
