# Night Watch: the engine's test bench, written as a game.
#
# This is the pack formerly titled Runlog Engine Testing. Every construct the
# pack format accepts appears here at least once, but what the player reads
# is a season of nights at a small observatory, not a list of scenarios.
# Which entry exercises which feature is written up in docs/testing-pack.md;
# the ids here are the ones that table names, and fixtures and app tests
# depend on them, so rename prose freely and ids never.
#
# Any table line can be forced from the keypad by typing a number in its
# range, or picked from the Table button beside the pad.
$schema: ../../packages/rules-schema/schema/pack-1.schema.json
schemaVersion: 1
id: com.scrthq.runlog.engine-testing
version: "0.1.0"
title: Night Watch
author: Runlog
description: >-
  A season of nights at a small observatory on a hill. Each Night you open
  the dome, read the Sky, expose a plate and record it, while the weather
  reaches back for the plates you have already made. It is also the engine's
  test bench: every kind of rule the format has appears in it once.
category: testing
tags: [testing, bench]

requires:
  - id: kit
    label: "A spare eyepiece"
    kind: equipment
    optional: true
    note: "A Watch without one draws again when the Sky asks for it."
  - id: keypad
    label: "A set of dice, or the keypad to stand in for them"
    kind: other
  - id: scorecard
    label: "A log book and a pencil"
    kind: supplies

license:
  id: MIT
  redistributable: true
  holder: Runlog

capabilities:
  - deferredTriggers
  - seededRuns
  - decks
  - standardDeck
  - resources
  - counters
  - coopRoles
  - backwardTargeting
  - timers
  - journal
  - bandsResolution
  - opposedResolution
  - keyedResolution
  - moderated

vocabulary:
  run: { one: Watch, many: Watches }
  unit: { one: Night, many: Nights }
  subject: { one: Plate, many: Plates }
  finalize: Record it

unit:
  clock: { kind: stopwatch, label: Exposure clock }
  createsSubject: true
  min: 1
  max: 99

states:
  blocks-edit:
    label: Fixed
    short: FX
    scope: subject
    semantics: [blocksEdit]
    description: The plate has been through the fixing bath. You may no longer alter it.
  untargetable:
    label: Clouded
    short: CL
    scope: subject
    semantics: [makesUntargetable]
    description: Cloud has closed over this plate. Nothing later in the Watch can reach back to it.
  excluded:
    label: Struck
    short: ST
    scope: subject
    semantics: [excludesFromResult]
    description: Struck from the log. It stays in the Watch, but takes no part in the finished record.
  locks-value:
    label: Vaulted
    short: VT
    scope: subject
    semantics: [locksValue]
    description: Taken into the vault. Only the sky may change this plate now; you may not.
  removed-play:
    label: Broken
    short: BR
    scope: subject
    semantics: [removesFromPlay]
    description: The glass is broken. The Night still happened; the plate did not survive it.
  posture-a:
    label: Blue Filter
    short: BF
    scope: subject
    group: posture
    description: A blue filter is mounted over this plate. A plate carries one filter at a time; mounting another takes this one off.
  posture-b:
    label: Yellow Filter
    short: YF
    scope: subject
    group: posture
    description: A yellow filter is mounted over this plate, in place of any other.
  posture-c:
    label: Red Filter
    short: RF
    scope: subject
    group: posture
    description: A red filter is mounted over this plate, in place of any other.
  temporary:
    label: Dewed
    short: DW
    scope: subject
    until: unitEnd
    description: Dew on the glass. It clears by itself when the Night ends.
  coldbench:
    label: The Long Freeze
    scope: run
    description: The cold has settled over the whole Watch, not any one plate.
  flagged:
    label: Commended
    scope: contestant
    description: A mark the director puts beside one observer's name during a Contest.
  marked:
    label: Circled
    short: CI
    scope: subject
    description: Circled in pencil on the sleeve. Something on this plate is worth a second look.

counters:
  streak:
    label: Quiet nights
    initial: 0
    min: 0
    incrementOn:
      - { on: phaseCompleted, phase: enter }
    resetOn:
      - { on: outcomeResolved, table: bench, cause: any }
    triggers:
      - when: { gte: 3 }
        oncePerRun: true
        label: Three quiet nights
        do:
          - { do: note, text: "Three quiet nights in a row. The sky has been kind for too long; expect it to turn." }
  hiddenCount:
    label: Smudges
    initial: 0
    hidden: true
    incrementOn:
      - { on: unitFinalized }

resources:
  pressure:
    label: Nerve
    initial: 0
    min: 0
    max: 10
    step: 1
    display: number
    description: How steady your hands are when the weather turns. Added to your roll against the Storm.
  fuel:
    label: Lamp oil
    initial: 2
    min: 0
    max: 5
    step: 1
    display: boxes
    description: Oil for the lamp, in flasks. The store holds five at most.
  momentum:
    label: Seeing
    initial: 0
    min: -3
    max: 5
    step: 1
    display: bar
    description: How steady the air is tonight. On a bad night it sinks below nothing.

decks:
  hand:
    kind: cards
    title: Notebook
    description: Slips tucked into the notebook. One is drawn when a Watch begins, and they carry over from Night to Night.
    drawAtStart: 1
    unique: true
    carriesOver: true
    cards:
      - id: card-steady
        title: Blank Slip
        text: Nothing written on it. Keep it, or throw it out.
        # no trigger: it exists to be drawn and discarded
      - id: card-double
        title: Folded Slip
        text: Two slips folded together. Draw another from the notebook at once.
        triggers:
          - on: immediately
            do:
              - { do: grantCard, deck: hand, count: 1 }
  cards52:
    kind: standard52
    title: The Cards
    description: An ordinary deck, jokers in. Each card drawn is read in the Almanac by its rank.
    includeJokers: true
    drawAtStart: 0
    resolveOn: rankcall
    resolveBy: rank

moves:
  chooseAndMark:
    label: Mount the yellow filter
    description: Choose a plate still in reach and mount the yellow filter on it. A plate carries one filter at a time.
    do:
      - { do: prompt, kind: chooseSubject, label: "Which plate?", eligibleOnly: true, into: markedProbe }
      - { do: applyState, state: posture-b, to: { var: markedProbe } }

  pickValue:
    label: Set the exposure
    description: Decide how long tonight's plate is exposed. The choice is written into the log.
    do:
      - { do: prompt, kind: chooseValue, label: "How long?", options: [Short, Long, All night], into: chosenValue }
      - { do: note, text: "The exposure is set and written in the log." }

  pickState:
    label: Note a condition
    description: Choose any condition the Watch knows and write down which one you saw.
    do:
      - { do: prompt, kind: chooseState, label: "Which condition?", into: chosenState }
      - { do: note, text: "The condition is written in the log." }

  confirmChoice:
    label: Check the clock
    description: A plain yes or no. Is the exposure clock running?
    do:
      - { do: prompt, kind: confirm, label: "Is the clock running?", into: confirmed }
      - { do: note, text: "You checked the clock." }

  captureNote:
    label: Write in the margin
    description: Whatever you write stands as this Night's note in the log.
    do:
      - { do: prompt, kind: text, label: "Write anything", into: freeText }
      - { do: note, text: "Your margin note stands as this Night's note.", persistent: true }

  liftLock:
    label: Sign the plate out of the vault
    description: Take this Night's plate back out of the vault, so you may change it again.
    do:
      - { do: removeState, state: locks-value, to: thisSubject }

  chooseThree:
    label: Sweep the field
    description: Look through the eyepiece three times and keep the one thing worth keeping.
    do:
      - { do: rollOn, table: chained, times: 3, choose: one, into: chosenChain }

  rollFromCount:
    label: Count the flashes
    description: Roll to see how many things cross the field, then look through the eyepiece once for each.
    do:
      - { do: roll, dice: d4, into: chargeCount, label: "How many?" }
      - { do: rollOn, table: chained, timesFrom: chargeCount }

  branchDemo:
    label: Test the seeing
    description: Roll a die. Low, and the air is poor; high, and it is fine; in between, ordinary.
    do:
      - { do: roll, dice: d6, into: benchRollVar, label: "Roll for the seeing" }
      - do: branch
        on: benchRollVar
        cases:
          - in: [1, 2]
            then:
              - { do: note, text: "Poor seeing. The stars swim." }
          - is: { gte: 5 }
            then:
              - { do: note, text: "Fine seeing. The stars are pinpoints." }
        else:
          - { do: note, text: "Ordinary seeing." }

  branchAgainstStreak:
    label: Trust the quiet
    description: Roll a die against the count of quiet nights. Beat it and the calm holds.
    do:
      - { do: roll, dice: d6, into: pressureRollVar, label: "Roll against the quiet nights" }
      - do: branch
        on: pressureRollVar
        cases:
          - is: { gteCounter: streak }
            then:
              - { do: note, text: "The calm holds." }
        else:
          - { do: note, text: "The quiet was borrowed. Expect weather." }

  startTimerDemo:
    label: Open the shutter for five minutes
    description: A five-minute exposure. The timer sounds when it is time to close the shutter.
    do:
      - { do: startTimer, minutes: 5, label: "Exposure" }

  setMomentumFromRoll:
    label: Rate the seeing
    description: Roll a die and set Seeing to whatever it shows.
    do:
      - { do: roll, dice: d6, into: momentumRoll, label: "Roll for Seeing" }
      - { do: modResource, resource: momentum, setFrom: momentumRoll }

  fillFuel:
    label: Refill the lamp
    description: Fill the store from the shed. Lamp oil goes to five flasks.
    do:
      - { do: modResource, resource: fuel, set: 5 }

  setCounterFromRoll:
    label: Count the smudges
    description: Roll a die and set the count of smudges to whatever it shows.
    do:
      - { do: roll, dice: d6, into: counterRoll, label: "Roll for smudges" }
      - { do: modCounter, counter: hiddenCount, setFrom: counterRoll }

  rewindDemo:
    label: Go back a Night
    description: Once a Watch, go back one Night and take it again from the start.
    oncePerRun: true
    do:
      - { do: rewind, count: 1 }

  askGated:
    label: Log a sighting
    description: Only offered once you say you saw something worth writing down.
    available:
      - { ask: "Did you see something worth writing down?" }
    do:
      - { do: note, text: "The sighting is written in the log." }

tables:
  # A d100 lookup with ten wide, exactly-tiled bands. Any line can be forced
  # from the keypad by typing a number in its range.
  bench:
    resolution: lookup
    title: The Sky
    description: >-
      Read when a Night begins: what the weather and the sky have for you.
    roll: d100
    entries:
      - id: bc-quiet
        range: [1, 10]
        title: A still sky
        text: Clear and still. Nothing to do but set up. The air is settled, and the next Night starts easier for it.
        triggers:
          - on: immediately
            do:
              - { do: setFlag, flag: primed, value: true }
      - id: bc-chain
        range: [11, 20]
        title: Something in the field
        text: Something moves in the field of view. Look through the Eyepiece and see what it is.
        triggers:
          - on: immediately
            do:
              - { do: rollOn, table: chained }
      - id: bc-reach
        range: [21, 30]
        title: Cloud drifts back
        text: Cloud drifts back over earlier work. Count back from the newest plate; the one it settles on is Clouded, and nothing can reach it again.
        tags: [reach]
        triggers:
          - on: immediately
            do:
              - { do: resolveTarget, from: currentRoll }
              - { do: applyState, state: untargetable, to: targetSubject }
      - id: bc-afterwork
        range: [31, 40]
        title: Dew forming
        text: The glass is fogging. Once tonight's exposure is done, wipe the lens and write it down.
        triggers:
          - on: afterWork
            label: Wipe the lens
            do:
              - { do: note, text: "The lens is wiped and the fog written down. It stays in the record.", persistent: true }
      - id: bc-onfinalize
        range: [41, 50]
        title: A late visitor
        text: Someone from the village climbs the hill to look. When you record the Night, show them the plate.
        triggers:
          - on: onFinalize
            label: Show the visitor the plate
            do:
              - { do: note, text: "The visitor has seen the plate and gone back down the hill." }
      - id: bc-end
        range: [51, 60]
        title: The lamp goes out
        text: The lamp gutters and goes out. The count of quiet nights is lost, and the Watch ends here, unless something already owes you another Night.
        triggers:
          - on: immediately
            do:
              - { do: modCounter, counter: streak, set: 0 }
              - { do: endRunAttempt }
      - id: bc-requires
        range: [61, 70]
        title: Two plates side by side
        text: Two plates held up to the lamp show a difference. It only comes up once there are two plates to compare.
        requires:
          - { subjectCount: { gte: 2 } }
        triggers:
          - on: immediately
            do:
              - do: when
                all: [{ subjectCount: { gte: 2 } }]
                then:
                  - { do: note, text: "The plates disagree. Note where." }
                else:
                  - { do: note, text: "Nothing to compare yet." }
      - id: bc-needs
        range: [71, 80]
        title: The spare eyepiece
        text: You reach for the spare eyepiece and find a slip tucked in its case. Draw one from the notebook. A Watch without a spare draws again instead of landing here.
        needs: [kit]
        triggers:
          - on: immediately
            do:
              - { do: grantCard, deck: hand, count: 1 }
      - id: bc-grants
        range: [81, 90]
        title: Worth a second look
        text: There is something on this plate worth coming back to. Circle it on the sleeve.
        grants: [marked]
      - id: bc-scored
        range: [91, 100]
        title: The clearest night of the season
        text: >-
          The clearest sky of the season. Worth two points in a Contest,
          and the next Night you read the Sky twice.
        tags: [scored]
        points: 2
        triggers:
          - on: immediately
            do:
              - { do: extraRoll, table: bench, count: 1, unit: next }

  chained:
    resolution: lookup
    title: The Eyepiece
    description: >-
      Looked through whenever the Sky sends you to it. Six things it can find.
    roll: d6
    entries:
      - id: cn-1
        range: [1, 1]
        title: Nothing there
        text: Nothing. Throw out one slip from the notebook.
        triggers:
          - on: immediately
            do:
              - { do: discardCard, deck: hand, count: 1 }
      - id: cn-2
        range: [2, 2]
        title: The director's note
        text: A note from the director takes an earlier plate into the vault. Roll to see which one.
        triggers:
          - on: immediately
            do:
              - { do: resolveTarget, from: event }
              - { do: applyState, state: locks-value, to: targetSubject }
      - id: cn-3
        range: [3, 3]
        title: A flaw in the glass
        text: One earlier plate turns out to be flawed. Choose which, and strike it from the log.
        triggers:
          - on: immediately
            do:
              - { do: resolveTarget, from: choice }
              - { do: applyState, state: excluded, to: targetSubject }
      - id: cn-4
        range: [4, 4]
        title: Blue haze
        text: The field is washed blue. Mount the blue filter on tonight's plate.
        triggers:
          - on: immediately
            do:
              - { do: applyState, state: posture-a, to: thisSubject }
      - id: cn-5
        range: [5, 5]
        title: Red haze
        text: The field glows red. Mount the red filter on tonight's plate; it takes any other filter off.
        grants: [posture-c]
      - id: cn-6
        range: [6, 6]
        title: Look again
        text: Something crosses the field before you can fix it. Look through the Eyepiece once more this Night.
        triggers:
          - on: immediately
            do:
              - { do: extraRoll, table: chained, count: 1, unit: current }

  # A bands table with genuinely open ends: the lowest and highest tiers
  # have no ceiling or floor at all.
  ladder:
    resolution: bands
    title: The Weather
    description: >-
      How the weather will turn. Read on the first Night of a Watch.
    roll: 2d6
    entries:
      - id: ld-low
        lte: 5
        title: Fog by morning
        text: Fog is coming. When the next Night begins, if the air had settled, write down how far you could see.
        triggers:
          - on: onEnterUnit
            when:
              - { flag: primed }
            do:
              - { do: note, text: "The next Night has begun in settled air, and how far you could see is written down." }
      - id: ld-mid
        gte: 6
        lte: 9
        title: Holding
        text: The weather holds. Once you have named this Night's plate, note the time you started.
        triggers:
          - on: onDeclareSubject
            do:
              - { do: note, text: "This Night's plate is named, and the time is written beside it." }
      - id: ld-high
        gte: 10
        title: Hail
        text: Hail on the dome. Every plate from an earlier Night is broken.
        triggers:
          - on: immediately
            do:
              - { do: applyState, state: removed-play, to: allPriorSubjects }

  # An opposed roll: an action die plus a resource against three challenge
  # dice, counting how many it beat.
  duel:
    resolution: opposed
    title: The Storm
    description: >-
      Your steadiness plus Nerve against three gusts, counting how many you
      hold against. Ties go to the storm.
    action: d6
    addResource: pressure
    challenge:
      dice: d8
      count: 3
    entries:
      - id: du-0
        beats: 0
        title: The long freeze
        text: The storm wins outright. The long freeze settles over the whole Watch, and you owe it two more Nights before you may stop.
        triggers:
          - on: immediately
            do:
              - { do: applyState, state: coldbench, to: run }
              - { do: forceUnit, count: 2 }
      - id: du-1
        beats: 1
        title: One gust turned
        text: You hold against one gust. Nerve rises by one, and there is one more smudge on the plate.
        triggers:
          - on: immediately
            do:
              - { do: modResource, resource: pressure, by: 1 }
              - { do: modCounter, counter: hiddenCount, by: 1 }
      - id: du-2
        beats: 2
        title: Two gusts turned
        text: The storm passes, but it leaves a debt. The first time you try to end the Watch, write down what the storm cost.
        triggers:
          - on: onDeclareRunOver
            when:
              - { unitIndex: { gte: 1 } }
            do:
              - { do: note, text: "What the storm cost is written down, at the first attempt to end the Watch." }
      - id: du-3
        beats: 3
        title: The storm breaks
        text: You hold against all three. Every plate made so far, tonight's included, goes through the fixing bath and is Fixed.
        triggers:
          - on: immediately
            do:
              - { do: applyState, state: blocks-edit, to: allSubjects }

  # A keyed table, addressed by a standard deck's rank rather than a number.
  rankcall:
    resolution: keyed
    title: The Almanac
    description: Read for every card drawn from the deck, by its rank.
    entries:
      - { id: rk-a, key: a, text: "The new moon. The darkest sky of the month." }
      - { id: rk-2, key: "2", text: "Mercury, low in the west just after sunset." }
      - { id: rk-3, key: "3", text: "Venus, bright enough to cast a shadow." }
      - { id: rk-4, key: "4", text: "The Moon at first quarter, half lit." }
      - { id: rk-5, key: "5", text: "Mars, small and red, high after midnight." }
      - { id: rk-6, key: "6", text: "Jupiter, with its four moons in a line." }
      - { id: rk-7, key: "7", text: "Saturn, rings wide open." }
      - { id: rk-8, key: "8", text: "A meteor shower, peaking tonight." }
      - { id: rk-9, key: "9", text: "The Milky Way straight overhead." }
      - { id: rk-10, key: "10", text: "The full moon, washing out everything faint." }
      - { id: rk-j, key: j, text: "A comet, low and faint, not on any chart." }
      - { id: rk-q, key: q, text: "An occultation. The Moon passes in front of a star." }
      - { id: rk-k, key: k, text: "An eclipse, partial from this hill." }

# anchoredOffset targeting: every anchor, both directions, wraparound,
# skipIneligible, and an eventFallback with missOn.
targeting:
  strategy: anchoredOffset
  offsetFrom: onesDigit
  wraparound: true
  skipIneligible: true
  bands:
    - { range: [21, 30], anchor: newest, direction: before }
    - { range: [31, 40], anchor: oldest, direction: after }
    - { range: [41, 50], anchor: playerChoice }
  eventFallback:
    roll: d100
    tensOddBand: 21
    tensEvenBand: 31
    missOn: 100

phases:
  - id: enter
    label: Open the dome
    steps:
      - kind: rollTable
        table: bench
        label: Read the Sky
        into: benchRoll
        optional: true
        skipWhen:
          - { flag: skipBenchRoll }

  - id: declare
    label: Name the plate
    steps:
      - kind: declareSubject
        label: What is tonight's plate?
        constrainedBy: chained
        skipWhen:
          - { unitIndex: { lte: 0 } }

  - id: secondary
    label: The first Night's weather
    description: Only on the first Night of a Watch. The Storm, then the Weather.
    skipWhen:
      - { unitIndex: { gte: 2 } }
    steps:
      - kind: rollTable
        table: duel
        label: Roll the Storm
      - kind: rollTable
        table: ladder
        label: Read the Weather

  - id: work
    label: The exposure
    steps:
      - kind: manual
        label: Expose the plate.
        description: The app cannot see the sky. It only records that you did the work.
        checklist:
          - "The plate is exposed and in its sleeve."
          - { text: "The time is written on the sleeve.", optional: true }
          - { text: "A smudge on the plate.", tally: hiddenCount }
          - { text: "Whatever the Sky sent tonight has been dealt with.", shows: { table: bench, scope: unit } }

  - id: actionsPhase
    label: Close the dome
    steps:
      - kind: actions
        do:
          - { do: note, text: "The dome is closed and the eyepiece capped." }
        skipWhen:
          - { flag: skipActionsPhase }

  - id: close
    label: Record it
    steps:
      - kind: finalizeUnit
        label: Record the Night
        confirm:
          - "The plate is labeled and put away."
          - { text: "Anything the Sky did to this plate is written on its sleeve.", shows: { table: bench, scope: subject } }

journal:
  enabled: true
  prompt: What did tonight's plate show, or fail to show?
  required: true

endings:
  - id: logged
    label: The Log Closed
    text: The Watch stands as kept. Close the log and go down the hill.
  - id: exhausted
    label: The Season's End
    text: Nothing left in the sky to look for this season. Close the log.
    requires:
      - { counter: streak, is: { gte: 0 } }
  - id: cut-short
    label: Called Down
    text: Called down the hill early. The log ends where it ends.

# Global triggers, restricted by the format to onEnterUnit and onRunEnd.
triggers:
  - on: onRunEnd
    label: Dawn
    when:
      - { not: { flag: skippedCooldown } }
    do:
      - { do: note, text: "Dawn. The dome is closed for the last time this Watch, and the plates go to the vault.", persistent: true }

modes:
  solo:
    label: Alone on the Hill
    description: One keeper, one telescope. On the second Night the dome is left open, and you note the temperature instead.
    perUnit:
      - unit: 2
        skipPhases: [actionsPhase]
        extra:
          - { do: note, text: "The second Night. The dome stays open; write down the temperature." }

  seeded:
    label: The Same Sky
    description: Two keepers can take the same Watch from a shared seed and meet the same sky, Night for Night.
    seeded: true

  together:
    label: The Crew
    description: Two to four keepers at one telescope, passing three jobs clockwise, with ten minutes on the exposure timer each Night.
    players:
      min: 2
      max: 4
      rotate: clockwise
      roles:
        - { id: roller, label: Hands, description: Makes every roll. }
        - { id: namer, label: Recorder, description: Names every plate. }
        - { id: judge, label: Director, description: Answers every question the Watch asks. }
    clock: { kind: timer, minutes: 10, auto: true, label: Exposure timer }

  moderated:
    label: The Contest
    description: A director keeps the Watch for two to four observers on a roster. Every scored sky goes to everyone, with a point extra for whoever was first.
    moderated:
      contestants: { min: 2, max: 4 }
      award: everyone
      firstBonus: 1

  endless:
    label: The Long Season
    description: No end but the one you choose, up to ninety-nine Nights.
    units: { max: 99 }

  minimal:
    label: A Calm Season
    description: No Storm, no closing the dome, and no count of smudges. The quietest way to keep a Watch.
    disable:
      tables: [duel]
      phases: [actionsPhase]
      counters: [hiddenCount]

defaultMode: solo

hierarchy:
  - Ending
  - The Storm
  - The Sky
  - General rules

# Reducer fixtures. Replayed by `runlog test`; each names what it proves
# and asserts the exact state the events leave behind.
fixtures:
  - name: "Tables: a still Sky settles the air"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: bench, entryId: bc-quiet, cause: phase }
      - { t: FlagSet, flag: primed, value: true }
    expect:
      - { path: flags.primed, equals: true }
      - { path: outcomes.length, equals: 1 }
      - { path: outcomes.0.entryId, equals: bc-quiet }

  - name: "Tables: the Sky sends you to the Eyepiece"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: bench, entryId: bc-chain, cause: phase }
      - { t: Rolled, purpose: chained, dice: d6, total: 4, values: [4], source: rng }
      - { t: OutcomeResolved, table: chained, entryId: cn-4, cause: action }
    expect:
      - { path: outcomes.length, equals: 2 }
      - { path: outcomes.1.table, equals: chained }
      - { path: outcomes.1.entryId, equals: cn-4 }

  - name: "Reaching back: the current roll clouds an earlier Plate"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: SubjectDeclared, subjectType: "First Plate" }
      - { t: UnitFinalized }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: bench, entryId: bc-reach, cause: phase, targetSubject: 1 }
      - { t: StateApplied, state: untargetable, subject: 1 }
    expect:
      - { path: subjects.0.states, equals: [untargetable] }
      - { path: outcomes.0.targetSubject, equals: 1 }

  - name: "Deferred: an afterWork obligation is owed and unresolved"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: ObligationAdded, obligation: { id: ob-1, kind: trigger, text: "The lens is wiped and the fog written down. It stays in the record.", on: afterWork, persistent: true } }
    expect:
      - { path: obligations.length, equals: 1 }
      - { path: obligations.0.resolved, equals: false }
      - { path: obligations.0.on, equals: afterWork }

  - name: "Deferred: an onFinalize obligation is paid off"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: ObligationAdded, obligation: { id: ob-2, kind: trigger, text: "The visitor has seen the plate and gone back down the hill.", on: onFinalize } }
      - { t: ObligationResolved, id: ob-2 }
    expect:
      - { path: obligations.0.resolved, equals: true }

  - name: "Units: the lamp going out ends the Watch"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: bench, entryId: bc-end, cause: phase }
      - { t: CounterChanged, counter: streak, set: 0 }
      - { t: RunEnded, ending: logged }
    expect:
      - { path: status, equals: ended }
      - { path: ending, equals: logged }
      - { path: counters.streak, equals: 0 }

  - name: "Rolls: the next Night reads the Sky twice"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: bench, entryId: bc-scored, cause: phase }
      - { t: ExtraRollQueued, table: bench, count: 1, unit: next }
      - { t: UnitEntered }
    expect:
      - { path: extraRolls.bench, equals: 1 }
      - { path: unit, equals: 2 }

  - name: "Rolls: an extra look owed this Night is paid down"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: ExtraRollQueued, table: chained, count: 2, unit: current }
      - { t: ExtraRollTaken, table: chained }
    expect:
      - { path: extraRolls.chained, equals: 1 }

  - name: "Units: going back sends the Watch back a Night"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: UnitEntered }
      - { t: RewindQueued, count: 1 }
      - { t: UnitEntered }
    expect:
      - { path: unit, equals: 1 }
      - { path: rewinds, equals: 1 }
      - { path: rewindNext, equals: 0 }

  - name: "States: dew clears when the Night ends"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: StateApplied, state: temporary, subject: 1 }
      - { t: UnitFinalized }
    expect:
      - { path: subjects.0.states, equals: [] }

  - name: "States: a group of three filters displace each other"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: StateApplied, state: posture-a, subject: 1 }
      - { t: StateApplied, state: posture-b, subject: 1 }
    expect:
      - { path: subjects.0.states, equals: [posture-b] }

  - name: "Moderated: a contestant state and an award to everyone"
    mode: moderated
    events:
      - { t: RunStarted, mode: moderated }
      - { t: ContestantAdded, contestant: c1, name: "Observer One" }
      - { t: ContestantAdded, contestant: c2, name: "Observer Two" }
      - { t: ContestantStateApplied, contestant: c1, state: flagged }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: bench, entryId: bc-scored, cause: phase }
      - { t: Awarded, contestant: c1, outcome: 0, table: bench, entryId: bc-scored, points: 2 }
      - { t: Awarded, contestant: c2, outcome: 0, table: bench, entryId: bc-scored, points: 2 }
    expect:
      - { path: contestants.length, equals: 2 }
      - { path: contestants.0.states, equals: [flagged] }
      - { path: awards.length, equals: 2 }
      - { path: awards.1.points, equals: 2 }

  - name: "Counters: increment on phase completion, and a reset dominates the unit"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: PhaseCompleted, phase: enter }
      - { t: UnitEntered }
      - { t: PhaseCompleted, phase: enter }
      - { t: UnitFinalized }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: bench, entryId: bc-quiet, cause: phase }
      - { t: PhaseCompleted, phase: enter }
    expect:
      - { path: counters.streak, equals: 0 }
      - { path: counters.hiddenCount, equals: 1 }

  - name: "Counters and resources: modCounter and modResource clamp to their bounds"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: CounterChanged, counter: hiddenCount, by: 2 }
      - { t: CounterChanged, counter: hiddenCount, set: 9 }
      - { t: ResourceChanged, resource: momentum, by: -99 }
      - { t: ResourceChanged, resource: fuel, set: 99 }
    expect:
      - { path: counters.hiddenCount, equals: 9 }
      - { path: resources.momentum, equals: -3 }
      - { path: resources.fuel, equals: 5 }

  - name: "Clocks: a stopwatch and a timer each start and stop"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: ClockStarted, clock: watch1, kind: stopwatch, label: "Exposure clock" }
      - { t: ClockStarted, clock: timer1, kind: timer, label: "Ten Minutes", seconds: 600 }
      - { t: ClockStopped, clock: watch1, elapsedMs: 5000 }
      - { t: ClockStopped, clock: timer1, elapsedMs: 600000, expired: true }
    expect:
      - { path: clocks.length, equals: 2 }
      - { path: clocks.0.status, equals: done }
      - { path: clocks.1.expired, equals: true }

  - name: "Decks: the notebook draws and discards; a card draw is read in the Almanac by rank"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: CardDrawn, deck: hand, cardId: card-steady }
      - { t: CardDrawn, deck: hand, cardId: card-double }
      - { t: CardDiscarded, deck: hand, cardId: card-steady }
      - { t: CardDrawn, deck: cards52, cardId: "7-hearts" }
      - { t: OutcomeResolved, table: rankcall, entryId: rk-7, cause: action }
    expect:
      - { path: hand.length, equals: 2 }
      - { path: hand.0.cardId, equals: card-double }
      - { path: hand.1.cardId, equals: "7-hearts" }
      - { path: outcomes.0.table, equals: rankcall }
      - { path: outcomes.0.entryId, equals: rk-7 }

  - name: "Journal and checklist: a required note is recorded, and a tally tick raises its counter"
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: JournalWritten, unit: 1, text: "The bench proved what it set out to." }
      - { t: Checked, step: "work#0", item: tally-item, on: true }
      - { t: CounterChanged, counter: hiddenCount, by: 1 }
    expect:
      - { path: journal.1, equals: "The bench proved what it set out to." }
      - { path: checks, equals: ["work#0|tally-item"] }
      - { path: counters.hiddenCount, equals: 1 }
