# Somewhere to put the spells.
#
# A memory stone is a spell slot. A caster who has found none is a
# caster with two spells, which is a different game from the one a
# sorcery run is trying to be.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.give-memory-stones
version: "1.1.1"
title: Give Memory Stones
author: Runlog
description: >-
  Gives eight Memory Stones for additional spell slots.

tool: TarnishedTool
group: items

ops:
  - { op: item.named, args: { name: Memory Stone, quantity: 8 }, once: true }

license:
  id: MIT
  redistributable: true
