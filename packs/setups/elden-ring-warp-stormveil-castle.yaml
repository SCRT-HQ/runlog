# Inside the first legacy dungeon, at its front door.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-stormveil-castle
version: "1.0.0"
title: Warp to Stormveil Castle
author: Runlog
description: >-
  Moves the player to Stormveil Main Gate, in Stormveil Castle. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Stormveil Main Gate, area: Stormveil Castle }, once: true }

license:
  id: MIT
  redistributable: true
