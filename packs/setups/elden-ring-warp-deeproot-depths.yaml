# The bottom of the underground, at the roots.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-deeproot-depths
version: "1.0.0"
title: Warp to the Deeproot Depths
author: Runlog
description: >-
  Moves the player to Deeproot Depths, in Deeproot Depths. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Deeproot Depths, area: Deeproot Depths }, once: true }

license:
  id: MIT
  redistributable: true
