# Black flame incantations scale with faith and burn through enemy HP.
#
# A dex weapon with an off-hand seal lets you both cast and swing. Blackflame Monk
# robes weigh nothing and let you roll through danger. Faith gets the incantations
# high enough to sting, Vigor keeps you in the fight, and Arcane just meets the
# minimum so you can land bleeds when the flames run out.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.blackflame-apostle
version: "1.0.0"
title: Blackflame Apostle
author: Runlog
description: >-
  Dexterity weapon, off-hand seal, and black flame incantations that burn enemy
  health. For a midgame player who wants to combine melee and incantations.

tool: TarnishedTool
group: loadout

ops:
  - { op: value.set, args: { name: player.vigor, value: 17 } }
  - { op: value.set, args: { name: player.mind, value: 16 } }
  - { op: value.set, args: { name: player.endurance, value: 11 } }
  - { op: value.set, args: { name: player.strength, value: 18 } }
  - { op: value.set, args: { name: player.dexterity, value: 24 } }
  - { op: value.set, args: { name: player.intelligence, value: 7 } }
  - { op: value.set, args: { name: player.faith, value: 27 } }
  - { op: value.set, args: { name: player.arcane, value: 10 } }

  - { op: weapon.named, args: { name: Uchigatana, upgrade: 10 } }
  - { op: weapon.named, args: { name: Godslayer's Seal, upgrade: 10 } }

  - { op: item.named, args: { name: Blackflame Monk Hood, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Blackflame Monk Armor, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Blackflame Monk Gauntlets, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Blackflame Monk Greaves, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Black Flame, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Black Flame Blade, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Bloodflame Blade, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Catch Flame, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Flamedrake Talisman, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Faithful's Canvas Talisman, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Sacred Tear, quantity: 2 }, once: true }
  - { op: item.named, args: { name: Golden Seed, quantity: 2 }, once: true }

  # More than one talisman, and a Tarnished starts with one slot. The
  # pouches are the difference between a loadout and a loadout you can
  # actually wear.
  - { op: action.invoke, args: { action: GiveTalismanPouches }, once: true }

  # Spell slots, for the same reason: a seal or a staff with nothing
  # memorized casts nothing.
  - { op: item.named, args: { name: Memory Stone, quantity: 8 }, once: true }

license:
  id: MIT
  redistributable: true
