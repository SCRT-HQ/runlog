# Death and magic, wielded with the same hand.
#
# Sword of Night and Flame swings and casts, needing both strength and
# intelligence to wield. Prince of Death's Staff and Golden Order Seal let you
# cast when the sword finds no opening, and talismans push each spell to its
# limit. Spellblade armor keeps you mobile while you move between sword and
# spell, and your incantations give you advantage before the fight begins.
#
# After the lategame build of the same name in Fextralife's Elden Ring build
# progression: https://eldenring.wiki.fextralife.com/Deathblade_Build
#
# The weapon, the armor and the talismans are theirs. The stat spread and
# the reinforcement levels are ours: the page states requirements and a
# target level rather than a spread, so the rest is filled in to make a
# loadout that works the moment it is handed over.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.deathblade
version: "1.0.0"
title: Deathblade
author: Runlog
description: >-
  A sword that casts spells, staves to amplify magic, and incantations that
  turn battles before they begin.
  After Fextralife's lategame Deathblade build.

tool: TarnishedTool

ops:
  - { op: value.set, args: { name: player.vigor, value: 40 } }
  - { op: value.set, args: { name: player.mind, value: 30 } }
  - { op: value.set, args: { name: player.endurance, value: 22 } }
  - { op: value.set, args: { name: player.strength, value: 12 } }
  - { op: value.set, args: { name: player.dexterity, value: 12 } }
  - { op: value.set, args: { name: player.intelligence, value: 50 } }
  - { op: value.set, args: { name: player.faith, value: 32 } }

  - { op: weapon.named, args: { name: Sword of Night and Flame, upgrade: 8 } }
  - { op: weapon.named, args: { name: Prince of Death's Staff, upgrade: 10 } }
  - { op: weapon.named, args: { name: Golden Order Seal, upgrade: 8 } }

  - { op: item.named, args: { name: Spellblade's Pointed Hat, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Spellblade's Traveling Attire, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Spellblade's Gloves, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Spellblade's Trousers, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Fire Scorpion Charm, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Magic Scorpion Charm, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Dragoncrest Shield Talisman +1, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Godfrey Icon, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Golden Vow, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Black Flame, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Loretta's Greatbow, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Terra Magica, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Magic Glintblade, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Ancient Death Rancor, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Sacred Tear, quantity: 4 }, once: true }
  - { op: item.named, args: { name: Golden Seed, quantity: 6 }, once: true }

  # More than one talisman, and a Tarnished starts with one slot. The
  # pouches are the difference between a loadout and a loadout you can
  # actually wear.
  - { op: action.invoke, args: { action: GiveTalismanPouches }, once: true }

  # Spell slots, for the same reason: a seal or a staff with nothing
  # memorized casts nothing.
  - { op: item.named, args: { name: Memory Stone, quantity: 8 }, once: true }

license:
  id: MIT
  redistributable: true
