# A holy warrior, discipline and faith in equal measure.
#
# Lordsworn's Straight Sword is a holy blade that scales with faith, a Brass
# Shield keeps you alive while you learn, and the incantations teach you both
# blessing and healing. This loadout asks you to stand your ground, let enemies
# come to you, and mend yourself when they do.
#
# After the beginner build of the same name in Fextralife's Elden Ring build
# progression: https://eldenring.wiki.fextralife.com/Paladin_Build
#
# The weapon, the armor and the talismans are theirs. The stat spread and
# the reinforcement levels are ours: the page states requirements and a
# target level rather than a spread, so the rest is filled in to make a
# loadout that works the moment it is handed over.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.paladin
version: "1.0.0"
title: Paladin
author: Runlog
description: >-
  Holy faith to cast with, a sword and shield to hold the line, and
  incantations that mend wounds and bless your stand.
  After Fextralife's beginner Paladin build.

tool: TarnishedTool
group: loadout

ops:
  - { op: value.set, args: { name: player.vigor, value: 30 } }
  - { op: value.set, args: { name: player.mind, value: 21 } }
  - { op: value.set, args: { name: player.endurance, value: 18 } }
  - { op: value.set, args: { name: player.faith, value: 28 } }

  - { op: weapon.named, args: { name: Lordsworn's Straight Sword, upgrade: 6, affinity: Sacred } }
  - { op: weapon.named, args: { name: Brass Shield, upgrade: 6 } }
  - { op: weapon.named, args: { name: Finger Seal, upgrade: 6 } }

  - { op: item.named, args: { name: Confessor Hood, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Confessor Armor, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Confessor Gloves, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Confessor Boots, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Urgent Heal, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Heal, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Golden Vow, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Faithful's Canvas Talisman, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Talisman of Lord's Bestowal, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Erdtree's Favor, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Golden Seed, quantity: 3 }, once: true }
  - { op: item.named, args: { name: Sacred Tear, quantity: 2 }, once: true }

  # More than one talisman, and a Tarnished starts with one slot. The
  # pouches are the difference between a loadout and a loadout you can
  # actually wear.
  - { op: action.invoke, args: { action: GiveTalismanPouches }, once: true }

  # Spell slots, for the same reason: a seal or a staff with nothing
  # memorized casts nothing.
  - { op: item.named, args: { name: Memory Stone, quantity: 8 }, once: true }

license:
  id: MIT
  redistributable: true
