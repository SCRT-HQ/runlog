# The city that falls into the world after Radahn does.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-nokron
version: "1.0.1"
title: Warp to Nokron, Eternal City
author: Runlog
description: >-
  Warps to Nokron- Eternal City in Nokron- Eternal City, even if the site of
  grace has not been discovered.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Nokron- Eternal City, area: Nokron- Eternal City }, once: true }

license:
  id: MIT
  redistributable: true
