# Levels, bought rather than earned.
#
# One lump, once. `runes.give` adds and cannot set, because nothing in
# the game says how many somebody is carrying, so there is no number to
# set one to; and it is `once` because a gift re-applied on every
# reconnect is a different game by the third one.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.give-runes
version: "1.0.0"
title: Give Runes
author: Runlog
description: >-
  A million runes, handed over once. Enough to level well past where the
  run would have started you and to buy what you would have gone
  shopping for, without being so much that spending stops mattering.

tool: TarnishedTool
group: items

ops:
  - { op: runes.give, args: { amount: 1000000 }, once: true }

license:
  id: MIT
  redistributable: true
