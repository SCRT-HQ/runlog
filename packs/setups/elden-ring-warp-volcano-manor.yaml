# The manor itself, and everything it asks of you.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-volcano-manor
version: "1.0.0"
title: Warp to Volcano Manor
author: Runlog
description: >-
  Moves the player to Volcano Manor, in Volcano Manor. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Volcano Manor, area: Volcano Manor }, once: true }

license:
  id: MIT
  redistributable: true
