# The top of the lift, where the midgame begins.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-altus-plateau
version: "1.0.1"
title: Warp to the Altus Plateau
author: Runlog
description: >-
  Warps to Altus Plateau in Altus Plateau, even if the site of grace has not
  been discovered.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Altus Plateau, area: Altus Plateau }, once: true }

license:
  id: MIT
  redistributable: true
