# The late game, falling into the sea.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-farum-azula
version: "1.0.0"
title: Warp to Crumbling Farum Azula
author: Runlog
description: >-
  Moves the player to Crumbling Beast Grave, in Crumbling Farum Azula. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Crumbling Beast Grave, area: Crumbling Farum Azula }, once: true }

license:
  id: MIT
  redistributable: true
