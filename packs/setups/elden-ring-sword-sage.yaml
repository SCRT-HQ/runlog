# A sword and spellcasting, both in one loadout.
#
# The Sword of Night and Flame is a unique weapon that works two ways: a melee
# strike and a magical stance that lets you cast a beam or burst depending on
# which button you press. Intelligence and Faith make both modes worth using,
# and Meteorite Staff gives you another cast option for the spells that finish
# what the sword starts. Light caster robes keep you fast enough to reposition
# when you need to.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.sword-sage
version: "1.0.0"
title: Sword Sage
author: Runlog
description: >-
  A sword that casts and spells that follow. Intelligence and Faith both work
  in this build, so your sword scales and your death sorceries land hard.

tool: TarnishedTool

ops:
  - { op: value.set, args: { name: player.vigor, value: 27 } }
  - { op: value.set, args: { name: player.mind, value: 25 } }
  - { op: value.set, args: { name: player.endurance, value: 12 } }
  - { op: value.set, args: { name: player.strength, value: 12 } }
  - { op: value.set, args: { name: player.dexterity, value: 12 } }
  - { op: value.set, args: { name: player.intelligence, value: 34 } }
  - { op: value.set, args: { name: player.faith, value: 24 } }

  # A unique weapon that works two ways: melee and magical.
  - { op: weapon.named, args: { name: Sword of Night and Flame, upgrade: 6 } }

  # A staff for the spells the sword does not cast.
  - { op: weapon.named, args: { name: Meteorite Staff, upgrade: 14 } }

  # Light robes for a caster's speed and durability.
  - { op: item.named, args: { name: Azur's Glintstone Crown, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Astrologer Robe, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Astrologer Gloves, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Astrologer Trousers, quantity: 1 }, once: true }

  # Talismans that make both sword and spells count.
  - { op: item.named, args: { name: Godfrey Icon, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Graven-School Talisman, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Radagon Icon, quantity: 1 }, once: true }

  # Spells that finish what the sword starts.
  - { op: item.named, args: { name: Rancorcall, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Ancient Death Rancor, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Glintstone Pebble, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Sacred Tear, quantity: 3 }, once: true }
  - { op: item.named, args: { name: Golden Seed, quantity: 4 }, once: true }

  # More than one talisman, and a Tarnished starts with one slot. The
  # pouches are the difference between a loadout and a loadout you can
  # actually wear.
  - { op: action.invoke, args: { action: GiveTalismanPouches }, once: true }

  # Spell slots, for the same reason: a seal or a staff with nothing
  # memorized casts nothing.
  - { op: item.named, args: { name: Memory Stone, quantity: 8 }, once: true }

license:
  id: MIT
  redistributable: true
