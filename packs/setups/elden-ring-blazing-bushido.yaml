# Fire and steel from a curved path, where the flame lives in both arms and the soul.
#
# The Uchigatana is quicker than heavier blades, leaving room for fire magic that
# this build weaves between swings. Hoslow's armor fits the samurai aesthetic without
# the weight of full plate, and the talismans make both blade and flame hit harder.
# Faith scales the incantations, Dexterity scales the weapon, and Vigor keeps you
# standing through the lategame.
#
# After the lategame build of the same name in Fextralife's Elden Ring build
# progression: https://eldenring.wiki.fextralife.com/Blazing_Bushido_Build
#
# The weapon, the armor and the talismans are theirs. The stat spread and
# the reinforcement levels are ours: the page states requirements and a
# target level rather than a spread, so the rest is filled in to make a
# loadout that works the moment it is handed over.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.blazing-bushido
version: "1.0.0"
title: Blazing Bushido
author: Runlog
description: >-
  A curved blade with fire affinity, incantations that burn, and armor that
  moves with you. Dexterity and faith make the weapon and spells worth using
  together.
  After Fextralife's lategame Blazing Bushido build.

tool: TarnishedTool

ops:
  - { op: value.set, args: { name: player.vigor, value: 60 } }
  - { op: value.set, args: { name: player.mind, value: 35 } }
  - { op: value.set, args: { name: player.endurance, value: 25 } }
  - { op: value.set, args: { name: player.strength, value: 12 } }
  - { op: value.set, args: { name: player.dexterity, value: 75 } }
  - { op: value.set, args: { name: player.faith, value: 45 } }

  - { op: weapon.named, args: { name: Uchigatana, upgrade: 20, affinity: Fire } }

  - { op: item.named, args: { name: Hoslow's Helm, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Hoslow's Armor, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Hoslow's Gauntlets, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Hoslow's Greaves, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Flame of the Fell God, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Catch Flame, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Ritual Sword Talisman, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Claw Talisman, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Flamedrake Talisman, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Sacred Tear, quantity: 4 }, once: true }
  - { op: item.named, args: { name: Golden Seed, quantity: 5 }, once: true }

  # More than one talisman, and a Tarnished starts with one slot. The
  # pouches are the difference between a loadout and a loadout you can
  # actually wear.
  - { op: action.invoke, args: { action: GiveTalismanPouches }, once: true }

license:
  id: MIT
  redistributable: true
