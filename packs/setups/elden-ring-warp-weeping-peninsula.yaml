# South, past the bridge, in the rain.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-weeping-peninsula
version: "1.0.0"
title: Warp to the Weeping Peninsula
author: Runlog
description: >-
  Moves the player to Church of Pilgrimage, in Weeping Peninsula. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Church of Pilgrimage, area: Weeping Peninsula }, once: true }

license:
  id: MIT
  redistributable: true
