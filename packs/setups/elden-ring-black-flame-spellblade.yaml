# Black Flame spells and bleeding status on a dexterous melee fighter.
#
# The Uchigatana scales with Dexterity and takes the Black Flame Blade buff,
# which adds fire damage and scales with Faith. Godslayer's Seal lets you cast
# directly, and the Blackflame Monk armor ties the look together. Rotten Winged
# Sword and Alexander's Shard push damage higher, Fire Scorpion Charm amplifies
# the Black Flame incantations, and Godfrey Icon boosts your heavies.
#
# After the lategame build of the same name in Fextralife's Elden Ring build
# progression: https://eldenring.wiki.fextralife.com/Black_Flame_Spellblade_Build
#
# The weapon, the armor and the talismans are theirs. The stat spread and
# the reinforcement levels are ours: the page states requirements and a
# target level rather than a spread, so the rest is filled in to make a
# loadout that works the moment it is handed over.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.black-flame-spellblade
version: "1.0.0"
title: Black Flame Spellblade
author: Runlog
description: >-
  Dexterity to swing an Uchigatana, Faith to cast Black Flame spells, and a
  seal to weave them together. Scales damage with both stats and stays mobile
  in the Blackflame Monk set.
  After Fextralife's lategame Black Flame Spellblade build.

tool: TarnishedTool
group: loadout

ops:
  - { op: value.set, args: { name: player.vigor, value: 40 } }
  - { op: value.set, args: { name: player.mind, value: 25 } }
  - { op: value.set, args: { name: player.endurance, value: 20 } }
  - { op: value.set, args: { name: player.strength, value: 18 } }
  - { op: value.set, args: { name: player.dexterity, value: 40 } }
  - { op: value.set, args: { name: player.intelligence, value: 10 } }
  - { op: value.set, args: { name: player.faith, value: 50 } }
  - { op: value.set, args: { name: player.arcane, value: 12 } }

  - { op: weapon.named, args: { name: Uchigatana, upgrade: 20 } }
  - { op: weapon.named, args: { name: Godslayer's Seal, upgrade: 20 } }

  - { op: item.named, args: { name: Blackflame Monk Hood, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Blackflame Monk Armor, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Blackflame Monk Gauntlets, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Blackflame Monk Greaves, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Godfrey Icon, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Fire Scorpion Charm, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Rotten Winged Sword Insignia, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Shard of Alexander, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Black Flame Blade, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Bloodflame Blade, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Black Flame, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Scouring Black Flame, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Golden Vow, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Sacred Tear, quantity: 4 }, once: true }
  - { op: item.named, args: { name: Golden Seed, quantity: 6 }, once: true }

  # More than one talisman, and a Tarnished starts with one slot. The
  # pouches are the difference between a loadout and a loadout you can
  # actually wear.
  - { op: action.invoke, args: { action: GiveTalismanPouches }, once: true }

  # Spell slots, for the same reason: a seal or a staff with nothing
  # memorized casts nothing.
  - { op: item.named, args: { name: Memory Stone, quantity: 8 }, once: true }

license:
  id: MIT
  redistributable: true
