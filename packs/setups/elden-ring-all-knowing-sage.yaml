# Two staffs and two paths: intelligence and faith at full power.
#
# The Staff of the Great Beyond casts sorceries with the weight of
# intelligence. The Sword of Night and Flame gives you a melee option that
# scales from both stats and carries its own magical modes. Fifty points of
# each stat means both weapons work and the spells reach their potential.
# The All-Knowing armor set ties the look together and gives the poise you
# need to finish a spell without interruption.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.all-knowing-sage
version: "1.0.0"
title: All-Knowing Sage
author: Runlog
description: >-
  Intelligence and faith in balance: a staff that casts sorceries, a sword
  that weaves magic into melee, and diverse spells to cover distance and
  adapt to what you face.

tool: TarnishedTool
group: loadout

ops:
  # Settings: the stats this hybrid caster needs to use both paths.
  - { op: value.set, args: { name: player.vigor, value: 40 } }
  - { op: value.set, args: { name: player.mind, value: 45 } }
  - { op: value.set, args: { name: player.endurance, value: 15 } }
  - { op: value.set, args: { name: player.strength, value: 12 } }
  - { op: value.set, args: { name: player.dexterity, value: 12 } }
  - { op: value.set, args: { name: player.intelligence, value: 50 } }
  - { op: value.set, args: { name: player.faith, value: 50 } }
  - { op: value.set, args: { name: player.arcane, value: 4 } }

  # A somber staff for sorceries, both upgraded to their limit.
  - { op: weapon.named, args: { name: Staff of the Great Beyond, upgrade: 10 } }

  # A sword that casts on its own, taking one more weapon slot but
  # letting you switch to melee and back without losing spell access.
  - { op: weapon.named, args: { name: Sword of Night and Flame, upgrade: 10 } }

  # The All-Knowing set: thematic armor that gives poise to cast.
  - { op: item.named, args: { name: All-Knowing Helm, quantity: 1 }, once: true }
  - { op: item.named, args: { name: All-Knowing Armor, quantity: 1 }, once: true }
  - { op: item.named, args: { name: All-Knowing Gauntlets, quantity: 1 }, once: true }
  - { op: item.named, args: { name: All-Knowing Greaves, quantity: 1 }, once: true }

  # Talismans that make sorceries and incantations both land harder.
  - { op: item.named, args: { name: Godfrey Icon, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Graven-Mass Talisman, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Radagon Icon, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Ritual Sword Talisman, quantity: 1 }, once: true }

  # Spells: intelligence sorceries to pressure at range, and faith to adapt
  # to what resists magic.
  - { op: item.named, args: { name: Glintstone Cometshard, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Smarag's Glintstone Breath, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Borealis's Mist, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Lightning Spear, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Sacred Tear, quantity: 4 }, once: true }
  - { op: item.named, args: { name: Golden Seed, quantity: 6 }, once: true }

  # More than one talisman, and a Tarnished starts with one slot. The
  # pouches are the difference between a loadout and a loadout you can
  # actually wear.
  - { op: action.invoke, args: { action: GiveTalismanPouches }, once: true }

  # Spell slots, for the same reason: a seal or a staff with nothing
  # memorized casts nothing.
  - { op: item.named, args: { name: Memory Stone, quantity: 8 }, once: true }

license:
  id: MIT
  redistributable: true
