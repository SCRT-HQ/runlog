# The climb toward the manor, which is a bad place to be underlevelled.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-mt-gelmir
version: "1.0.0"
title: Warp to Mt. Gelmir
author: Runlog
description: >-
  Moves the player to First Mt. Gelmir Campsite, in Mt. Gelmir. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: First Mt. Gelmir Campsite, area: Mt. Gelmir }, once: true }

license:
  id: MIT
  redistributable: true
