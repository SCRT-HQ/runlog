# Inside the academy, past the gate that wants a key.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-raya-lucaria
version: "1.0.0"
title: Warp to the Academy of Raya Lucaria
author: Runlog
description: >-
  Moves the player to Church of the Cuckoo, in Academy of Raya Lucaria. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Church of the Cuckoo, area: Academy of Raya Lucaria }, once: true }

license:
  id: MIT
  redistributable: true
