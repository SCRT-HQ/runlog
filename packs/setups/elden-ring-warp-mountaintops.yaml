# The far end of the mountains, past the snow.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-mountaintops
version: "1.0.0"
title: Warp to the Mountaintops of the Giants
author: Runlog
description: >-
  Moves the player to First Church of Marika, in Mountaintops of the Giants. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: First Church of Marika, area: Mountaintops of the Giants }, once: true }

license:
  id: MIT
  redistributable: true
