# Underground, where the stars are.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-siofra-river
version: "1.0.1"
title: Warp to the Siofra River
author: Runlog
description: >-
  Warps to Siofra River Bank in Siofra River, even if the site of grace has not
  been discovered.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Siofra River Bank, area: Siofra River }, once: true }

license:
  id: MIT
  redistributable: true
