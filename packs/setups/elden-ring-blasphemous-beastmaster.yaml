# Strength and faith to cast incantations and swing a cursed greatsword.
#
# Blasphemous Blade is a strength weapon with a fixed ash of Taker's Flames,
# which sets it ablaze and restores health when it lands. Beast Claw and Bestial
# Sling scale with faith for the incantations, Clawmark Seal amplifies them,
# and the strength spreads the damage across your melee.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.blasphemous-beastmaster
version: "1.0.0"
title: Blasphemous Beastmaster
author: Runlog
description: >-
  Strength to swing Blasphemous Blade and Faith to cast beast incantations.
  Taker's Flames restores health and strikes with blasphemous fire.

tool: TarnishedTool
group: loadout

ops:
  - { op: value.set, args: { name: player.vigor, value: 45 } }
  - { op: value.set, args: { name: player.mind, value: 30 } }
  - { op: value.set, args: { name: player.endurance, value: 20 } }
  - { op: value.set, args: { name: player.strength, value: 40 } }
  - { op: value.set, args: { name: player.dexterity, value: 12 } }
  - { op: value.set, args: { name: player.intelligence, value: 7 } }
  - { op: value.set, args: { name: player.faith, value: 60 } }
  - { op: value.set, args: { name: player.arcane, value: 10 } }

  - { op: weapon.named, args: { name: Blasphemous Blade, upgrade: 8 } }
  - { op: weapon.named, args: { name: Clawmark Seal, upgrade: 10 } }
  - { op: weapon.named, args: { name: Cinquedea, upgrade: 8 } }

  - { op: item.named, args: { name: Beast Champion Helm, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Beast Champion Armor, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Beast Champion Gauntlets, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Beast Champion Greaves, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Ritual Sword Talisman, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Radagon's Soreseal, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Green Turtle Talisman, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Dragoncrest Shield Talisman +1, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Golden Vow, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Stone of Gurranq, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Beast Claw, quantity: 1 }, once: true }
  - { op: item.named, args: { name: Bestial Sling, quantity: 1 }, once: true }

  - { op: item.named, args: { name: Sacred Tear, quantity: 4 }, once: true }
  - { op: item.named, args: { name: Golden Seed, quantity: 6 }, once: true }

  # More than one talisman, and a Tarnished starts with one slot. The
  # pouches are the difference between a loadout and a loadout you can
  # actually wear.
  - { op: action.invoke, args: { action: GiveTalismanPouches }, once: true }

  # Spell slots, for the same reason: a seal or a staff with nothing
  # memorized casts nothing.
  - { op: item.named, args: { name: Memory Stone, quantity: 8 }, once: true }

license:
  id: MIT
  redistributable: true
