# The far corner of Caelid, reachable early by teleport and not on foot.
#
# A warp happens once and changes nothing else about the run, which is why
# it is a command rather than a loadout: the run's own setup is left alone.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.warp-dragonbarrow
version: "1.0.0"
title: Warp to Greyoll's Dragonbarrow
author: Runlog
description: >-
  Moves the player to Bestial Sanctum, in Greyoll's Dragonbarrow. Works whether or not they have ever
  found the place.

tool: TarnishedTool
group: warp

ops:
  - { op: warp.grace, args: { name: Bestial Sanctum, area: Greyoll's Dragonbarrow }, once: true }

license:
  id: MIT
  redistributable: true
