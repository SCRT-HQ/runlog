# Respec, as often as you like.
#
# The tool lists the base game's tear and the DLC's separately, because
# they are separate items. This hands over the base game's, which is
# the one Rennala asks for.

# yaml-language-server: $schema=../../packages/rules-schema/schema/setup-1.schema.json

kind: setup
schemaVersion: 1
id: com.scrthq.runlog.setups.give-larval-tears
version: "1.0.0"
title: Give Larval Tears
author: Runlog
description: >-
  Ten larval tears. Rebuild the character when the run makes you want
  to, without going to look for one first, and without the number
  being so large that the choice stops costing anything.

tool: TarnishedTool
group: items

ops:
  - { op: item.named, args: { name: "Larval Tear (Base Game)", quantity: 10 }, once: true }

license:
  id: MIT
  redistributable: true
