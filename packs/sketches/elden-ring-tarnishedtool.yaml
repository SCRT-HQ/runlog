counters:
  scenes:
    label: Scenes survived
    initial: 0
    min: 0
    incrementOn:
      - { on: unitFinalized }

  # Each racer's own. On a board with names it sits beside their score
  # and off the run's trackers: one number for four people's deaths is a
  # number nobody can do anything with. Alone, it is the run's as usual.
  deaths:
    label: Deaths
    initial: 0
    min: 0
    per: contestant


  # Long enough in one place, and the Lands Between are done with you.
  # How long is the player's, on the dial below: this counts the
  # scenes and puts itself back to nothing each time it fires.
  wander:
    label: Since you were moved
    initial: 0
    min: 0
    hidden: true
    incrementOn:
      - { on: unitFinalized }
    triggers:
      - when: { gteResource: warpEvery }
        label: Long enough in one place
        do:
          - { do: rollOn, table: displacement }
          - { do: modCounter, counter: wander, set: 0 }

# Not tallies of anything that happened: dials, with plus and minus on
# them in the trackers, which the player turns whenever the run turns
# out to be a different shape from the one they wanted. The steps read
# them and roll that many times; nothing has to be pressed for that to
# happen.
resources:
  curses:
    label: Curses per scene
    initial: 1
    min: 1
    max: 4
    step: 1
    display: number
    description: How many things are wrong with the world at once. Two is unpleasant; four is a different game.
  objectives:
    label: Objectives per scene
    initial: 1
    min: 1
    max: 4
    step: 1
    display: number
    description: How many objectives a scene draws. Turn it up when one thing to do stops being enough.
  minutes:
    label: Minutes a scene
    initial: 10
    min: 2
    max: 60
    step: 1
    display: number
    description: How long a scene runs once you start playing it. Read when the clock starts, so turning it changes the next scene and not this one.
  warpEvery:
    label: Scenes before a warp
    initial: 4
    min: 1
    max: 10
    step: 1
    display: number
    description: How long you are left where you are. At one, every scene ends somewhere else; at ten, you will mostly stay put and the warp is a shock when it comes.

tables:
  curse:
    resolution: lookup
    title: Curse
    description: >-
      Drawn at the top of every scene, and it holds until the scene
      ends. Some of these a tool does to the game; the rest are
      vows, which nothing enforces but you. How many are drawn is
      Curses per scene, a dial in the trackers: one is a game, two
      is unpleasant, four is a different game. Nothing in here is
      good for you, which is the point of it. A kindness you rolled
      into by accident is not a reward, and being paid is what the
      Blessing table is for. None are worth points either, since a
      curse lands on everyone.
    roll: d100
    entries:
      - id: cu-slow
        range: [1, 5]
        text: >-
          Your legs are heavy. You move at four fifths.
        tags: [curse, effect]
        grants: [slowed]
      - id: cu-wade
        range: [6, 7]
        text: >-
          You are wading. Two thirds speed, everywhere, all scene.
        tags: [curse, effect]
        grants: [wading]
      - id: cu-mired
        range: [8, 8]
        text: >-
          Mired. Half speed, and everything in this game is faster
          than you.
        tags: [curse, effect]
        grants: [mired]
      - id: cu-quick
        range: [9, 13]
        text: >-
          The world is hurried. Everything but you runs a fifth
          faster.
        tags: [curse, effect]
        grants: [hurried]
      - id: cu-frantic
        range: [14, 15]
        text: >-
          The world is frantic. Half again as fast as it should be.
        tags: [curse, effect]
        grants: [frantic]
      - id: cu-berserk
        range: [16, 16]
        text: >-
          The world has lost its mind. Everything at nearly double
          speed.
        tags: [curse, effect]
        grants: [berserk]
      - id: cu-slower
        range: [17, 18]
        text: >-
          Everything slows, you included. The world at four fifths.
        tags: [curse, effect]
        grants: [sluggish]
      - id: cu-tender
        range: [19, 23]
        text: >-
          You bruise. Half again the damage from everything.
        tags: [curse, effect]
        grants: [tender]
      - id: cu-glass
        range: [24, 28]
        text: >-
          You are glass. Everything that touches you hits twice as
          hard.
        tags: [curse, effect]
        grants: [glass]
      - id: cu-paper
        range: [29, 29]
        text: >-
          You are paper. Three times damage, and you will feel all
          of it.
        tags: [curse, effect]
        grants: [paper]
      - id: cu-blunt
        range: [30, 34]
        text: >-
          Your weapons are blunt. A little over half of what you
          should deal.
        tags: [curse, effect]
        grants: [blunted]
      - id: cu-dull
        range: [35, 36]
        text: >-
          Your weapons are dull. Two fifths, and everything takes
          twice as long.
        tags: [curse, effect]
        grants: [dulled]
      - id: cu-useless
        range: [37, 37]
        text: >-
          Your weapons are useless. A quarter damage. Consider
          running.
        tags: [curse, effect]
        grants: [useless]
      - id: cu-hollow
        range: [38, 39]
        text: >-
          Hollow. Your vigor is one for the scene; everything kills
          you.
        tags: [curse, effect]
        grants: [hollow]
      - id: cu-feeble
        range: [40, 41]
        text: >-
          Feeble. Your strength is one, and half of what you carry
          is unusable.
        tags: [curse, effect]
        grants: [feeble]
      - id: cu-clumsy
        range: [42, 43]
        text: >-
          Clumsy. Your dexterity is one; hope you were not built for
          it.
        tags: [curse, effect]
        grants: [clumsy]
      - id: cu-winded
        range: [44, 45]
        text: >-
          Winded. Your endurance is one. Two swings and a roll, if
          that.
        tags: [curse, effect]
        grants: [winded]
      - id: cu-empty
        range: [46, 46]
        text: >-
          Empty. Your mind is one. Whatever you cast, you do not,
          now.
        tags: [curse, effect]
        grants: [empty]
      - id: cu-poor
        range: [47, 51]
        text: >-
          Nothing is owed to you. No runes from anything that dies.
        tags: [curse, effect]
        grants: [poor]
      - id: cu-robbed
        range: [52, 53]
        text: >-
          Robbed. Ten thousand gone now, and nothing earned this
          scene is yours either.
        tags: [curse, effect]
        grants: [robbed]
      - id: cu-toll
        range: [54, 55]
        text: >-
          A toll. Ten thousand runes, taken, whether you had them or
          not.
        tags: [curse, effect]
      - id: cu-lost
        range: [56, 57]
        text: >-
          No map. You cannot open it this scene; go by landmark.
        tags: [curse, effect]
        grants: [mapless]
      - id: cu-unseen-world
        range: [58, 58]
        text: >-
          Nothing renders. You can see the world and nothing living
          in it.
        tags: [curse, effect]
        grants: [blind]
      - id: cu-risen
        range: [59, 62]
        text: >-
          The dead get up. Nothing you kill this scene stays down.
        tags: [curse, effect]
        grants: [risen]
      - id: cu-stone
        range: [63, 64]
        text: >-
          Nothing here can be hurt. Kill nothing; go around.
        tags: [curse, effect]
        grants: [stone]
      - id: cu-root
        range: [65, 68]
        text: >-
          You cannot dodge. No rolling this scene, at all.
        tags: [curse, effect]
        grants: [rooted]
      - id: cu-night
        range: [69, 70]
        text: >-
          Night falls, now, wherever you are.
        tags: [curse, effect]
        grants: [nightfall]
      - id: cu-dusk
        range: [71, 72]
        text: >-
          Dusk, and the light going.
        tags: [curse, effect]
        grants: [dusk]
      - id: cu-noon
        range: [73, 73]
        text: >-
          Noon, whether it suits you or not.
        tags: [curse, effect]
        grants: [noon]
      - id: cu-morning
        range: [74, 74]
        text: >-
          Morning. The light comes back, for what it is worth.
        tags: [curse, effect]
        grants: [morning]
      - id: cu-fog
        range: [75, 76]
        text: >-
          Fog rolls in and stays.
        tags: [curse, effect]
        grants: [fog]
      - id: cu-rain
        range: [77, 78]
        text: >-
          Rain, for the whole scene.
        tags: [curse, effect]
        grants: [rain]
      - id: cu-snow
        range: [79, 80]
        text: >-
          Snow, wherever you happen to be.
        tags: [curse, effect]
        grants: [snow]
      - id: cu-clear
        range: [81, 81]
        text: >-
          Clear skies, for once. Which means everything can see you.
        tags: [curse, effect]
        grants: [clear]
      - id: cu-alone
        range: [82, 85]
        text: >-
          Alone. Whatever you had in the ash slot is out of it, and
          stays out.
        tags: [curse, effect]
        grants: [alone]
      - id: cu-witless
        range: [86, 87]
        text: >-
          Witless. Your intelligence is one; whatever you were going
          to cast, you are not.
        tags: [curse, effect]
        grants: [witless]
      - id: cu-faithless
        range: [88, 89]
        text: >-
          Faithless. Your faith is one, and nothing is listening
          anyway.
        tags: [curse, effect]
        grants: [faithless]
      - id: cu-luckless
        range: [90, 91]
        text: >-
          Luckless. Your arcane is one. Nothing bleeds, nothing
          drops, nothing goes your way.
        tags: [curse, effect]
        grants: [luckless]
      - id: cu-journey
        range: [92, 92]
        text: >-
          A harder world. The journey goes up one for the scene;
          everything hits like it is somebody else's run.
        tags: [curse, effect]
        grants: [further]
      - id: cu-slideshow
        range: [93, 94]
        text: >-
          Thirty frames. You will feel every one of them.
        tags: [curse, effect]
        grants: [stutter]
      - id: cu-flicker
        range: [95, 95]
        text: >-
          Twenty frames, which is not a frame rate, it is a warning.
        tags: [curse, effect]
        grants: [flicker]
      - id: cu-float
        range: [96, 96]
        text: >-
          Gravity lets go. Mind the ceiling, and mind the landing.
        tags: [curse, effect]
        grants: [weightless]
      - id: cu-fixed
        range: [97, 98]
        text: >-
          Your health is pinned where it is. No healing it, no
          losing it slowly: whatever hits you takes it all or none.
        tags: [curse, effect]
        grants: [pinned]
      - id: cu-calm
        range: [99, 100]
        text: >-
          Nothing at all. Ten quiet minutes; use them.
        tags: [curse, quiet]

  objective:
    resolution: lookup
    title: Objective
    description: >-
      What the scene is for. Drawn after the curse, so you know what
      is wrong with the world before you are told what to do in it.
      Name the objective in your own words: the app cannot see your
      game, and the log should read like something that happened.
      How many are drawn is Objectives per scene, the other dial in
      the trackers. Two results in here add one and two more on top
      of whatever it says.
    roll: d100
    entries:
      - id: ob-near
        range: [1, 3]
        text: >-
          Whatever holds the nearest ruin, cave, catacomb or camp.
          Name it and kill it.
        tags: [objective]
        points: 3
      - id: ob-boss
        range: [4, 5]
        text: >-
          A named boss of wherever you have landed. Name it, find
          it, put it down.
        tags: [objective, hard]
        points: 5
