# Elden Ring: TarnishedTool, a run the world keeps interfering with.
#
# A pack playable by hand takes a curse as a thing the runner agrees to
# act out, on their word. This one is written the other way round. Every
# scene draws something that happens to the game itself, and a tool
# attached to it makes it happen: you really are slower, the dead really
# do get up, it really is night. That is what the name is for.
#
# It still plays with nothing attached. Every draw says plainly what it
# does, and two people at a table can honor it the way they always have.
# What changes with a tool attached is that nobody has to.
#
# The mapping from a draw to what the tool does is not in here, and could
# not be: this is a pack, and a pack that only worked with one Windows
# program attached to one game would not be one. It lives beside this file
# as a control profile. See packs/profiles/elden-ring-tarnishedtool.json.

$schema: ../../packages/rules-schema/schema/pack-1.schema.json
# yaml-language-server: $schema=../../packages/rules-schema/schema/pack-1.schema.json

schemaVersion: 1
id: com.scrthq.runlog.elden-ring-tarnishedtool
version: "3.3.1"
title: "Elden Ring: TarnishedTool"
author: Runlog
description: >-
  Ten minutes at a time, with the world against you. Every scene draws
  something wrong with the world and one to four things to do about it:
  slower legs, harder hits, a night that falls, the dead getting back
  up, and a boss or a hunt or a key item to settle anyway. Settle it and the land
  pays you. Every fourth scene it picks you up and puts you somewhere
  else, which is occasionally the sky.

category: games
tags: [Elden Ring, souls, solo, timed, effects]

# The tags anything outside this pack may match on.
#
# An entry tag is a free string and nothing ever checked it, which is fine
# while the only reader is the pack itself. It stops being fine the moment
# a mapping fires on `curse` and somebody types `curses`: the rule goes
# quiet for ever and nothing anywhere says so.
#
# Declaring them is this pack promising these particular words will not
# move. The linter holds it to the promise in both directions: an entry
# carrying a tag that is not here, and a tag here that no entry carries.
marks:
  curse:
    label: Curse
    note: Something the world does to the run.
  blessing:
    label: Blessing
    note: Something the world does for it.
  objective:
    label: Objective
    note: A thing to go and do, checked by the tool where it can be.
  displacement:
    label: Displacement
    note: Moved somewhere else, and paid for in runes.
  effect:
    note: Changes the game through the tool rather than by agreement.
  lasting:
    note: Holds until the scene closes rather than resolving at once.
  item:
    note: Involves something in the inventory.
  hard:
    note: Meant to hurt; a mode may thin these out.
  quiet:
    note: A note to the author rather than a promise to anybody.
  mercy:
    note: A note to the author rather than a promise to anybody.
  fall:
    note: A note to the author rather than a promise to anybody.

requires:
  - id: game
    label: Elden Ring
    kind: game
    note: >-
      Started in offline mode. Anything attached to the game while it is
      online is a ban; the machine itself stays online, since that is how
      the run reaches it. Tarnished Tool's Launch Game button starts it
      the right way.
  - { id: system, label: A PC, kind: platform }
  # Optional on purpose, and no result needs it. Without it every draw is
  # a thing you do on your honor and the game is the same game; with it,
  # nobody has to be trusted.
  - id: tool
    label: Tarnished Tool, with a Control tab
    kind: software
    note: >-
      Needed, not optional. Displacement names real graces and moves you
      to them, including ones you have never found and could not travel
      to by hand, and the curses are done to the game rather than
      acted out. Run the fork below, attach it, and load the profile
      beside this pack under Settings, Stream, Control.
    url: https://github.com/SCRT-HQ/TarnishedTool-runlog-integration

license:
  id: MIT
  redistributable: true
  holder: Runlog

capabilities:
  - counters
  - resources
  - deferredTriggers
  - timers
  - seededRuns
  - journal
  - moderated

vocabulary:
  run: { one: Trial, many: Trials }
  unit: { one: Scene, many: Scenes }
  subject: { one: Objective, many: Objectives }
  finalize: End the scene
  # A bundle of things a tool is set to is a loadout here, because that is
  # what somebody playing this game would call it. The file, the document
  # and the marketplace go on saying setup.
  setup: { one: Loadout, many: Loadouts }
  terms:
    roll: Draw

unit:
  createsSubject: true
  # The clock is on the playing, not on the drawing. It waits for the
  # Play phase, so reading four curses and naming an objective is not
  # spending the ten minutes they are read against; and how long it runs
  # is a dial, because ten minutes is a guess about somebody else's
  # evening.
  clock: { kind: timer, minutes: 10, minutesFrom: minutes, startsOn: play }
  min: 3
  max: 20

# What is on you right now. Every one of these lifts when the scene
# ends, which is the whole shape of the game: ten minutes of something
# being wrong, then ten minutes of something else.
