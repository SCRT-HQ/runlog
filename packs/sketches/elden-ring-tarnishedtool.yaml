          Lake of Rot Shoreside, Lake of Rot. The worst lake there
          is. Move fast.
        tags: [displacement]
      - id: dis-shunning
        range: [89, 90]
        text: >-
          Underground Roadside, Subterranean Shunning-Grounds. Under
          the capital, in the sewer.
        tags: [displacement]
      - id: dis-deeproot
        range: [91, 92]
        text: >-
          Root-Facing Cliffs, Deeproot Depths. The roots, a very
          long way down.
        tags: [displacement]
      - id: dis-snowfield
        range: [93, 94]
        text: >-
          Consecrated Snowfield, Consecrated Snowfield. A whiteout.
          You cannot see what is walking towards you.
        tags: [displacement]
      - id: dis-ordina
        range: [95, 96]
        text: >-
          Ordina- Liturgical Town, Consecrated Snowfield. The empty
          town with the lights, which is not empty.
        tags: [displacement]
      - id: dis-farum
        range: [97, 97]
        text: >-
          Crumbling Beast Grave, Crumbling Farum Azula. The end of
          the world, falling upward.
        tags: [displacement]
      - id: dis-table
        range: [98, 98]
        text: >-
          Table of Lost Grace, Roundtable Hold. A mercy. The
          Roundtable, and a moment to breathe.
        tags: [displacement]
      - id: dis-sky
        range: [99, 100]
        text: >-
          The sky. You are lifted a few hundred feet above wherever
          you were standing, and then you are not lifted any more.
        tags: [displacement, fall]

moves:
  # The two things only the player knows. The app cannot see the game, so
  # settling an objective is something you say, and saying it is what a blessing
  # is drawn on.
  #
  # Both are one racer's. On a board with four names, "I died" is four
  # different things and the run cannot tell which without being told,
  # so each is offered once per name and counts against the one who
  # pressed it. In a run with nobody on the board they are the table's,
  # which is every solo run of this pack.
  # The one thing only the player knows, in a run with nobody on a
  # board. Where there is a roster the moderator awards the objective
  # instead, which says the same thing and says who, so this is dropped
  # from that mode rather than offered beside it.
  settled:
    label: I settled it
    when: anytime
    description: The objective is done. Draw what it was worth.
    available:
      - { unitIndex: { gte: 1 } }
    do:
      - { do: rollOn, table: blessing }

  died:
    label: I died
    when: anytime
    per: contestant
    description: Count it. Nothing else happens; dying is its own punishment.
    do:
      - { do: modCounter, counter: deaths, by: 1 }

phases:
  - id: meddle
    label: Curse
    steps:
      - kind: rollTable
        table: curse
        label: Draw what is wrong with the world
      - kind: rollTable
        table: curse
        label: Draw a second curse
        skipWhen:
          - { resource: curses, is: { lte: 1 } }
      - kind: rollTable
        table: curse
        label: Draw a third curse
        skipWhen:
          - { resource: curses, is: { lte: 2 } }
      - kind: rollTable
        table: curse
        label: Draw a fourth curse
        skipWhen:
          - { resource: curses, is: { lte: 3 } }

  # One roll an objective. A step that is not wanted skips itself on the
  # dial rather than being queued by something the player has to press,
  # which is what these were before and it showed.
  - id: charge
    label: Objective
    steps:
      - kind: rollTable
        table: objective
        label: Draw what the scene is for
      - kind: rollTable
        table: objective
        label: Draw a second objective
        skipWhen:
          - { resource: objectives, is: { lte: 1 } }
      - kind: rollTable
        table: objective
        label: Draw a third objective
        skipWhen:
          - { resource: objectives, is: { lte: 2 } }
      - kind: rollTable
        table: objective
        label: Draw a fourth objective
        skipWhen:
          - { resource: objectives, is: { lte: 3 } }
      - kind: declareSubject
        constrainedBy: objective
        label: Name what you are going for, or take the words the dice used.

  - id: play
    label: Play
    steps:
      - kind: manual
        label: Play the scene. Stop when the clock does.
        description: >-
          Ten minutes. The curse is the rule and the objective is the
          point; getting neither done is an ordinary outcome. Settle the
          objective and say so, and the land pays you for it. If you die,
          say that too; it is only counted.
        checklist:
          - text: The curse is in force.
            shows: { table: curse, scope: unit }
          - text: The objective was named, and settled or not.
            shows: { table: objective, scope: unit }
          - text: If you settled it, you said so and took the blessing.
            shows: { table: blessing, scope: unit }
          - text: You were moved, if the land said so.
            shows: { table: displacement, scope: unit }

  - id: close
    label: End the scene
    steps:
      - kind: finalizeUnit
        label: End the scene

endings:
  - id: stop
    label: Call it
    text: The Trial ends. What you got through, you got through.
  - id: ten
    label: Ten scenes
    text: Ten scenes, and the world never did settle down.
    requires:
      - { counter: scenes, is: { gte: 10 } }

modes:
  solo:
    label: Solo
    description: Three to twenty scenes, one player, ten minutes each.
    units: { min: 3, max: 20 }

  short:
    label: An hour
    description: Six scenes. An hour of play, near enough, and then it is over.
    units: { fixed: 6 }

  seeded:
    label: Seeded
    description: The same scenes in the same order from one seed, so two people can run it against each other.
    seeded: true
    units: { fixed: 6 }

  party:
    label: Everyone at once
    description: >-
      One person draws and everybody plays it, each on their own copy, and
      the curse lands on every runner at the same moment. The harsh
      draws are worth points; award them to whoever got through the
      scene under one. A mercy is worth nothing.
    units: { min: 3, max: 20 }
    # Awarding an objective is how a race says somebody settled it, so that
    # is where the blessing is drawn and it is drawn for them. The move that
    # said the same thing is gone from this mode: two ways to declare
    # one thing meant the blessing was the run's rather than the winner's,
    # and the second press was the one nobody remembered.
    disable:
      moves: [settled]
    moderated:
      contestants: { min: 2, max: 8 }
      award: everyone
      onAward:
        - { do: rollOn, table: blessing }

defaultMode: solo

# Taken as it lands, not put in a tray.
#
# This pack is played with a tool attached, and the tool says two things:
# that you died, and that the objective it was watching is settled. Both
# are facts about the game rather than anybody's opinion of it, and both
# arrive mid-fight, which is the one moment nobody is going to tap accept.
# The host can still change it; this is what the run starts with.
asks:
  policy: auto

hierarchy:
  - Blessing
  - Displacement
  - Curse
  - General rules

fixtures:
  - name: A curse lands, holds for the scene, and is gone by the next one
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: curse, entryId: cu-root, cause: phase }
      - { t: StateApplied, state: rooted }
      - { t: UnitFinalized }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: curse, entryId: cu-calm, cause: phase }
    expect:
      - { path: counters.scenes, equals: 1 }
      - { path: runStates.length, equals: 0 }
      - { path: outcomes.length, equals: 2 }

  - name: Four scenes in one place leaves a displacement owed
    mode: solo
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: A quiet corner }
      - { step: "play#0" }
      - { finalize: {} }
      - { enter: 2 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: A quiet corner }
      - { step: "play#0" }
      - { finalize: {} }
      - { enter: 3 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: A quiet corner }
      - { step: "play#0" }
      - { finalize: {} }
      - { enter: 4 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: A quiet corner }
      - { step: "play#0" }
      - { finalize: {} }
    expect:
      - { path: counters.scenes, equals: 4 }
      # Owed, not taken: a threshold is put in front of the player, since
      # firing it means rolling, and the reducer cannot roll.
      - { path: counters.wander, equals: 4 }
      - { path: outcomes.length, equals: 8 }
      - { requests: answered }

  - name: Taking the displacement moves you on and starts the count again
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: CounterChanged, counter: wander, by: 4 }
      - { t: OutcomeResolved, table: displacement, entryId: dis-grace, cause: action }
      - { t: CounterChanged, counter: wander, set: 0 }
      - { t: TriggerFired, key: "counter:wander:0:u1" }
    expect:
      - { path: counters.wander, equals: 0 }
      - { path: outcomes.0.entryId, equals: dis-grace }
      - { path: firedOnce, contains: "counter:wander:0:u1" }

  - name: At one apiece, a scene draws one of each and asks for nothing
    mode: solo
    # The proof that the dials work is that this script runs at all. If
    # the second, third and fourth rolls did not skip themselves, the
    # declare would fail: the run would be waiting on meddle#1 rather
    # than on a name. Nothing is pressed and nothing is owed.
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: The camp on the ridge }
    expect:
      - { path: outcomes.length, equals: 2 }
      - { path: outcomes.0.table, equals: curse }
      - { path: outcomes.1.table, equals: objective }
      - { path: resources.curses, equals: 1 }
      - { path: resources.objectives, equals: 1 }
      - { requests: answered }

  - name: A result that asks for more objectives gets them without being pressed
    mode: solo
    # ob-two rolls the table again from its own trigger, which is not
    # the same machinery as the dial and needs its own answer.
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: [93, 1] } }
      - { declare: Both of them }
    expect:
      - { path: outcomes.0.entryId, equals: cu-calm }
      - { path: outcomes.1.entryId, equals: ob-two }
      - { path: outcomes.length, equals: 3 }
      - { requests: answered }

  - name: Settling an objective pays, and the blessing is drawn on the word of the player
    mode: solo
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: The camp on the ridge }
      - { move: settled, answers: { d100: 1 } }
    expect:
      # Two draws for the scene, and a third because the objective was
      # settled: nothing but the player could have told it that.
      - { path: outcomes.length, equals: 3 }
      - { path: outcomes.2.table, equals: blessing }
      - { requests: answered }

  - name: A death is counted and nothing else happens
    mode: solo
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { move: died }
      - { move: died }
    expect:
      - { path: counters.deaths, equals: 2 }
      - { path: runStates.length, equals: 0 }
