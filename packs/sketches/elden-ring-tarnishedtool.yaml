counters:
  scenes:
    label: Scenes survived
    initial: 0
    min: 0
    incrementOn:
      - { on: unitFinalized }

  # Each racer's own. On a board with names it sits beside their score
  # and off the run's trackers: one number for four people's deaths is a
  # number nobody can do anything with. Alone, it is the run's as usual.
  deaths:
    label: Deaths
    initial: 0
    min: 0
    per: contestant


  # Long enough in one place, and the Lands Between are done with you.
  # How long is the player's, on the dial below: this counts the
  # scenes and puts itself back to nothing each time it fires.
  wander:
    label: Since you were moved
    initial: 0
    min: 0
    hidden: true
    incrementOn:
      - { on: unitFinalized }
    triggers:
      - when: { gteResource: warpEvery }
        label: Long enough in one place
        do:
          - { do: rollOn, table: displacement }
          - { do: modCounter, counter: wander, set: 0 }

  # A build lands the moment a run opens, so nobody plays the first
  # scene with nothing on, and again every so often after that, on the
  # dial below. Counted from unit entry rather than unit close, the way
  # wander counts stretches spent stationary, so the first one is owed
  # at once instead of after the dial's worth of waiting.
  gear:
    label: Since your last build
    initial: 0
    min: 0
    hidden: true
    incrementOn:
      - { on: unitEntered }
    triggers:
      - when: { eq: 1 }
        oncePerRun: true
        label: Your first build
        do: &gearApply
          - do: when
            all: [{ unitIndex: { gteFraction: 0.75 } }]
            then:
              - { do: rollOn, table: loadout-endgame, per: contestant }
              - { do: rollOn, table: warp-endgame, per: contestant }
            else:
              - do: when
                all: [{ unitIndex: { gteFraction: 0.5 } }]
                then:
                  - { do: rollOn, table: loadout-lategame, per: contestant }
                  - { do: rollOn, table: warp-lategame, per: contestant }
                else:
                  - do: when
                    all: [{ unitIndex: { gteFraction: 0.25 } }]
                    then:
                      - { do: rollOn, table: loadout-midgame, per: contestant }
                      - { do: rollOn, table: warp-midgame, per: contestant }
                    else:
                      - { do: rollOn, table: loadout-beginner, per: contestant }
                      - { do: rollOn, table: warp-beginner, per: contestant }
          - { do: modCounter, counter: gear, set: 0 }
      - when: { gteResource: gearEvery }
        label: Time for a new build
        do: *gearApply

# Not tallies of anything that happened: dials, with plus and minus on
# them in the trackers, which the player turns whenever the run turns
# out to be a different shape from the one they wanted. The steps read
# them and roll that many times; nothing has to be pressed for that to
# happen.
resources:
  curses:
    label: Curses per scene
    initial: 1
    min: 1
    max: 4
    step: 1
    display: number
    description: "Number of curses drawn at the start of each scene."
  objectives:
    label: Objectives per scene
    initial: 1
    min: 1
    max: 4
    step: 1
    display: number
    description: "Number of objectives drawn each scene."
  minutes:
    label: Minutes a scene
    initial: 10
    min: 2
    max: 60
    step: 1
    display: number
    description: "Duration of the next scene once play starts. Changes take effect on the next scene."
  warpEvery:
    label: Scenes before a warp
    initial: 4
    min: 1
    max: 10
    step: 1
    display: number
    description: "Number of scenes between warps, from one to ten."
  gearEvery:
    label: Scenes before a new build
    initial: 5
    min: 1
    max: 10
    step: 1
    display: number
    description: "Number of scenes between builds after the first, from one to ten."

tables:
  curse:
    resolution: lookup
    title: Curse
    description: >-
      Draw Curses per scene at the start of each scene. Most curses
      end with the scene. Time and weather changes persist until
      another action changes them; their board badges end with the
      scene. TarnishedTool applies game effects; the player must
      follow any vows. The tracker sets how many curses to draw,
      from one to four. Curses give no points and no rewards.
    roll: d100
    entries:
      - id: cu-slow
        range: [1, 5]
        text: >-
          Move at four fifths speed.
        tags: [curse, effect]
        grants: [slowed]
