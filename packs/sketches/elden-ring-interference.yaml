  target:
    resolution: lookup
    title: Target
    description: >-
      What the stretch is for. Drawn after the interference, so you
      know what is wrong with the world before you are told what to
      do in it. Name the target in your own words: the app cannot
      see your game, and the log should read like something that
      happened.
    roll: d100
    entries:
      - id: ta-near
        range: [1, 5]
        text: >-
          Whatever holds the nearest ruin, cave, catacomb or camp.
          Name it and kill it.
        tags: [target]
        points: 3
      - id: ta-boss
        range: [6, 9]
        text: >-
          A named boss of wherever you have landed. Name it, find
          it, put it down.
        tags: [target, hard]
        points: 5
      - id: ta-field
