counters:
  stretches:
    label: Stretches survived
    initial: 0
    min: 0
    incrementOn:
      - { on: unitFinalized }

  deaths:
    label: Deaths
    initial: 0
    min: 0

  # Four stretches in one place is long enough. This is the counter that
  # moves you on, and it puts itself back to nothing each time it fires.
  wander:
    label: Since you were moved
    initial: 0
    min: 0
    hidden: true
    incrementOn:
      - { on: unitFinalized }
    triggers:
      - when: { gte: 4 }
        label: Four stretches in one place
        do:
          - { do: rollOn, table: displacement }
          - { do: modCounter, counter: wander, set: 0 }

tables:
  interference:
    resolution: lookup
    title: Interference
    description: >-
      Drawn at the top of every stretch, and it holds until the
      stretch ends. Some of these a tool does to the game; the rest
      are vows, which nothing enforces but you. None are worth
      points: an interference lands on everyone, and living with it
      is the ordinary business of a stretch.
    roll: d100
    entries:
      - id: in-slow
        range: [1, 1]
        text: >-
          Your legs are heavy. You move at four fifths.
        tags: [interference, effect]
        grants: [slowed]
      - id: in-wade
        range: [2, 3]
        text: >-
          You are wading. Two thirds speed, everywhere, all stretch.
        tags: [interference, effect]
        grants: [wading]
      - id: in-swift
        range: [4, 5]
        text: >-
          A mercy. You move a quarter faster.
        tags: [mercy, effect]
        grants: [swift]
      - id: in-quick
        range: [6, 6]
        text: >-
          The world is hurried. Everything but you runs a fifth
          faster.
        tags: [interference, effect]
        grants: [hurried]
      - id: in-frantic
