counters:
  stretches:
    label: Stretches survived
    initial: 0
    min: 0
    incrementOn:
      - { on: unitFinalized }

  deaths:
    label: Deaths
    initial: 0
    min: 0


  # Long enough in one place, and the Lands Between are done with you.
  # How long is the player's, on the dial below: this counts the
  # stretches and puts itself back to nothing each time it fires.
  wander:
    label: Since you were moved
    initial: 0
    min: 0
    hidden: true
    incrementOn:
      - { on: unitFinalized }
    triggers:
      - when: { gteResource: warpEvery }
        label: Long enough in one place
        do:
          - { do: rollOn, table: displacement }
          - { do: modCounter, counter: wander, set: 0 }

# Not tallies of anything that happened: dials, with plus and minus on
# them in the trackers, which the player turns whenever the run turns
# out to be a different shape from the one they wanted. The steps read
# them and roll that many times; nothing has to be pressed for that to
# happen.
resources:
  interferences:
    label: Interferences per stretch
    initial: 1
    min: 1
    max: 4
    step: 1
    display: number
    description: How many things are wrong with the world at once. Two is unpleasant; four is a different game.
  targets:
    label: Targets per stretch
    initial: 1
    min: 1
    max: 4
    step: 1
    display: number
    description: How many targets a stretch draws. Turn it up when one thing to do stops being enough.
  warpEvery:
    label: Stretches before a warp
    initial: 4
    min: 1
    max: 10
    step: 1
    display: number
    description: How long you are left where you are. At one, every stretch ends somewhere else; at ten, you will mostly stay put and the warp is a shock when it comes.

tables:
  interference:
    resolution: lookup
    title: Interference
    description: >-
      Drawn at the top of every stretch, and it holds until the
      stretch ends. Some of these a tool does to the game; the rest
      are vows, which nothing enforces but you. How many are drawn
      is Interferences per stretch, a dial in the trackers: one is a
      game, two is unpleasant, four is a different game. Nothing in
      here is good for you, which is the point of it. A kindness you
      rolled into by accident is not a reward, and being paid is
      what the Boon table is for. None are worth points either,
      since an interference lands on everyone.
    roll: d100
    entries:
      - id: in-slow
        range: [1, 1]
        text: >-
          Your legs are heavy. You move at four fifths.
        tags: [interference, effect]
        grants: [slowed]
      - id: in-wade
        range: [2, 3]
        text: >-
          You are wading. Two thirds speed, everywhere, all stretch.
        tags: [interference, effect]
        grants: [wading]
      - id: in-mired
        range: [4, 4]
        text: >-
          Mired. Half speed, and everything in this game is faster
          than you.
        tags: [interference, effect]
        grants: [mired]
      - id: in-quick
        range: [5, 5]
        text: >-
          The world is hurried. Everything but you runs a fifth
          faster.
        tags: [interference, effect]
        grants: [hurried]
      - id: in-frantic
        range: [6, 7]
        text: >-
          The world is frantic. Half again as fast as it should be.
        tags: [interference, effect]
        grants: [frantic]
      - id: in-berserk
        range: [8, 8]
        text: >-
          The world has lost its mind. Everything at nearly double
          speed.
        tags: [interference, effect]
        grants: [berserk]
      - id: in-slower
        range: [9, 10]
        text: >-
          Everything slows, you included. The world at four fifths.
        tags: [interference, effect]
        grants: [sluggish]
      - id: in-tender
