        range: [91, 92]
        text: >-
          No fast travel. Ride or walk wherever you are going.
        tags: [interference, vow]
        grants: [overland]
      - id: vo-noloot
        range: [93, 94]
        text: >-
          Pick nothing up. Walk past all of it.
        tags: [interference, vow]
        grants: [empty-handed]
      - id: vo-fight
        range: [95, 96]
        text: >-
          Fight what you wake. Nothing you aggro may be left behind.
        tags: [interference, vow]
        grants: [standing]
      - id: vo-twohand
        range: [97, 97]
        text: >-
          Two hands on one weapon, the whole stretch.
        tags: [interference, vow]
        grants: [twohanded]
      - id: vo-moving
        range: [98, 98]
        text: >-
          Keep moving. Never stand still for longer than it takes to
          swing.
        tags: [interference, vow]
        grants: [driven]
      - id: in-calm
        range: [99, 100]
        text: >-
          Nothing at all. Ten quiet minutes; use them.
        tags: [interference, quiet]

  target:
    resolution: lookup
    title: Target
    description: >-
      What the stretch is for. Drawn after the interference, so you
      know what is wrong with the world before you are told what to
      do in it. Name the target in your own words: the app cannot
      see your game, and the log should read like something that
      happened. How many are drawn is Targets per stretch, the other
      dial in the trackers. Two results in here add one and two more
      on top of whatever it says.
    roll: d100
    entries:
      - id: ta-near
        range: [1, 4]
        text: >-
          Whatever holds the nearest ruin, cave, catacomb or camp.
          Name it and kill it.
        tags: [target]
        points: 3
      - id: ta-boss
        range: [5, 7]
        text: >-
          A named boss of wherever you have landed. Name it, find
          it, put it down.
        tags: [target, hard]
        points: 5
      - id: ta-field
        range: [8, 9]
        text: >-
          A field boss out in the open. The kind with a health bar
          and no door.
        tags: [target]
        points: 4
      - id: ta-again
        range: [10, 11]
        text: >-
          A boss you have already beaten, again, at whatever it
          costs.
        tags: [target, hard]
        points: 4
      - id: ta-gaol
        range: [12, 13]
        text: >-
          An evergaol. Name one, open it, and finish what is inside.
        tags: [target, hard]
        points: 4
      - id: ta-tunnel
        range: [14, 15]
        text: >-
          A mine or tunnel, all the way to whatever is at the end.
        tags: [target, hard]
        points: 4
      - id: ta-catacomb
        range: [16, 17]
        text: >-
          A catacomb, to the bottom, including the thing at the
          bottom.
        tags: [target, hard]
        points: 4
      - id: ta-cave
        range: [18, 19]
        text: >-
          A cave, to the bottom, including whatever lives there.
        tags: [target]
        points: 3
      - id: ta-tunnel-boss
        range: [20, 21]
        text: >-
          A mine. Down to the bottom and through whatever is
          guarding the ore.
        tags: [target, hard]
        points: 4
      - id: ta-knight
        range: [22, 24]
        text: >-
          A knight. Any of the big armored ones, wherever you are.
        tags: [target]
        points: 3
      - id: ta-dragon
        range: [25, 26]
        text: >-
          Something enormous. A dragon, a giant, a troll. Name it.
        tags: [target, hard]
        points: 5
      - id: ta-invader
        range: [27, 28]
        text: >-
          A hostile NPC. Whoever invades, or whoever you go and
          invade.
        tags: [target]
        points: 3
      - id: ta-beast
        range: [29, 30]
        text: >-
          A great beast: a lion, a bear, a crab, a pack of wolves
          that will not come one at a time.
        tags: [target]
        points: 3
      - id: ta-three
        range: [31, 33]
        text: >-
          Three of a kind. Pick an enemy type you can see and kill
          three.
        tags: [target]
        points: 2
      - id: ta-five
        range: [34, 36]
        text: >-
          Five of a kind. Pick a type and count to five.
        tags: [target]
        points: 3
      - id: ta-ten
        range: [37, 37]
        text: >-
          Ten of a kind. Yes, ten. Pick something common.
        tags: [target, hard]
        points: 5
      - id: ta-camp
        range: [38, 39]
        text: >-
          Clear a camp. Every enemy in one encampment, to the last.
        tags: [target, hard]
        points: 4
      - id: ta-building
        range: [40, 41]
        text: >-
          Clear a building. Everything inside one structure, top to
          bottom.
        tags: [target]
        points: 3
      - id: ta-patrol
        range: [42, 43]
        text: >-
          A patrol. Follow it to the end of its round, then kill all
          of it where it stops.
        tags: [target]
        points: 3
      - id: ta-night
        range: [44, 44]
        text: >-
          Something that only comes out at night. Wait for it if you
          must.
        tags: [target, hard]
        points: 5
      - id: ta-church
        range: [45, 47]
        text: >-
          A church you have not been inside. Find one, get to the
          altar, and take what is on it.
        tags: [target]
        points: 3
      - id: ta-key
        range: [48, 49]
        text: >-
          A key item: a stonesword key, a whetblade, a medallion
          half. Name one and take it.
        tags: [target]
        points: 3
      - id: ta-map
        range: [50, 51]
        text: >-
          A map fragment. Name which one and go and get it.
        tags: [target]
        points: 3
      - id: ta-seed
        range: [52, 53]
        text: >-
          A Golden Seed or a Sacred Tear. Either will do; name it
          first.
        tags: [target]
        points: 3
      - id: ta-stone
        range: [54, 55]
        text: >-
          Smithing stones, three of them, of any kind.
        tags: [target]
        points: 2
      - id: ta-talisman
        range: [56, 57]
        text: >-
          A talisman you do not own. Name it and wear it out of
          there.
        tags: [target]
        points: 3
      - id: ta-weapon
        range: [58, 59]
        text: >-
          A weapon you do not own, and swing it once before the
          stretch ends.
        tags: [target]
        points: 3
      - id: ta-ash
        range: [60, 61]
        text: >-
          An Ash of War, or a Spirit Ash. Name it and take it.
        tags: [target]
        points: 3
      - id: ta-spell
        range: [62, 63]
        text: >-
          A spell or incantation you do not know.
        tags: [target]
        points: 3
      - id: ta-scarab
        range: [64, 65]
        text: >-
          A teardrop scarab. Chase one down and kill it before it
          gets away.
        tags: [target]
        points: 3
      - id: ta-grace
        range: [66, 68]
        text: >-
          A grace you have never lit. Get to one and light it,
          however far that is.
        tags: [target]
        points: 2
      - id: ta-erdtree
        range: [69, 71]
        text: >-
          A Minor Erdtree. Get to one and kill whatever is standing
          under it.
        tags: [target, hard]
        points: 4
      - id: ta-cross
        range: [72, 73]
        text: >-
          Into the next region, overland. No fast travel, and arrive
          at a grace on the other side.
        tags: [target]
        points: 3
      - id: ta-caravan
        range: [74, 75]
        text: >-
          A caravan. Kill what is pulling it, kill what is guarding
          it, and take what it was carrying.
        tags: [target, hard]
        points: 4
      - id: ta-runebear
        range: [76, 77]
        text: >-
          A Runebear. Find one, fight it, and do not leave until one
          of you is finished.
        tags: [target, hard]
        points: 5
      - id: ta-door
        range: [78, 79]
        text: >-
          An imp statue door. Find one, find a stonesword key, and
          take what is behind it.
        tags: [target]
        points: 3
      - id: ta-upgrade
        range: [80, 81]
        text: >-
          Put a weapon up a tier. Find the stones for it this
          stretch, whatever that takes.
        tags: [target]
        points: 3
      - id: ta-rise
        range: [82, 83]
        text: >-
          A Rise. Get inside it, work out what it wants, and take
          what is at the top.
        tags: [target, hard]
        points: 4
      - id: ta-level
        range: [84, 85]
        text: >-
          A level. Earn the runes for it this stretch and spend them
          before it ends.
        tags: [target]
        points: 3
      - id: ta-road
        range: [86, 87]
        text: >-
          A road. Follow it to the next grace along it and kill
          everything that contests the way.
        tags: [target]
        points: 3
      - id: ta-nohit
        range: [88, 89]
        text: >-
          Whatever you name, do it without being hit once.
        tags: [target, hard]
        points: 6
      - id: ta-nofla
        range: [90, 91]
        text: >-
          Whatever you name, do it without drinking anything.
        tags: [target, hard]
        points: 5
      - id: ta-fast
        range: [92, 92]
        text: >-
          Whatever you name, do it in the first half of the stretch.
        tags: [target, hard]
        points: 5
      - id: ta-two
        range: [93, 94]
        text: >-
          One more than you were going to have. Draw again, and
          settle both before the stretch is out.
        tags: [target, hard]
        triggers:
          - on: immediately
            do:
              - { do: rollOn, table: target }
      - id: ta-three-t
        range: [95, 95]
        text: >-
          Two more than you were going to have. Draw twice again.
          Good luck.
        tags: [target, hard]
        triggers:
          - on: immediately
            do:
              - { do: rollOn, table: target }
              - { do: rollOn, table: target }
      - id: ta-rest
        range: [96, 98]
        text: >-
          Nothing is asked of you. Survive the stretch and that is
          enough.
        tags: [target, mercy]
      - id: ta-back
        range: [99, 100]
        text: >-
          Back to where the last stretch started, overland, on foot
          or on Torrent. No fast travel.
        tags: [target]
        points: 3
        requires:
          - { unitIndex: { gte: 2 } }

  boon:
    resolution: lookup
    title: Boon
    description: >-
      What settling a target is worth. Drawn when you say you
      settled it, which is the only way anything here can know.
      Nothing in it is a punishment and nothing is worth points: the
      points were on the target.
    roll: d100
    entries:
      - id: bo-runes
        range: [1, 5]
        text: >-
          Runes, five thousand of them, for nothing but doing as you
          were told.
        tags: [boon, blessing]
      - id: bo-runes2
        range: [6, 8]
        text: >-
          Runes, twenty thousand. Spend them before something takes
          them.
        tags: [boon, blessing]
      - id: bo-seed
        range: [9, 13]
        text: >-
          A Golden Seed. One more swallow, for the rest of the run.
        tags: [boon, item]
      - id: bo-tear
        range: [14, 15]
        text: >-
          A Sacred Tear. What you have goes further now.
        tags: [boon, item]
      - id: bo-arc
        range: [16, 20]
        text: >-
          A Rune Arc, and the great rune to go with it.
        tags: [boon, item]
      - id: bo-stone
        range: [21, 25]
        text: >-
          Smithing Stones, three of them, for whatever you are
          carrying.
        tags: [boon, item]
      - id: bo-somber
        range: [26, 27]
        text: >-
          A Somber Smithing Stone, for the thing you actually use.
        tags: [boon, item]
      - id: bo-key
        range: [28, 29]
        text: >-
          Two Stonesword Keys. Something behind an imp statue is
          yours.
        tags: [boon, item]
      - id: bo-gold
        range: [30, 31]
        text: >-
          Golden Runes, ten of them, held for when you need them.
        tags: [boon, item]
      - id: bo-flesh
        range: [32, 33]
        text: >-
          Exalted Flesh. Hit harder for a while; it is up to you
          when.
        tags: [boon, item]
      - id: bo-blessing
        range: [34, 35]
        text: >-
          Blessings of Marika, three. Healing you did not have to
          earn.
        tags: [boon, item]
      - id: bo-baldachin
        range: [36, 37]
        text: >-
          Baldachin's Blessing. Somebody is looking out for you.
        tags: [boon, item]
      - id: bo-dragon
        range: [38, 39]
        text: >-
          An Ancient Dragon's Blessing. Save it for something
          enormous.
        tags: [boon, item]
      - id: bo-fowl
        range: [40, 41]
        text: >-
          Silver-Pickled Fowl Feet. Everything is worth more for a
          while.
        tags: [boon, item]
      - id: bo-boluses
        range: [42, 43]
        text: >-
          Neutralizing Boluses, against whatever is about to poison
          you.
        tags: [boon, item]
      - id: bo-branch
        range: [44, 45]
        text: >-
          Bewitching Branches. Make a friend of something that was
          not one.
        tags: [boon, item]
      - id: bo-shards
        range: [46, 47]
        text: >-
          Starlight Shards, for anyone who casts.
        tags: [boon, item]
      - id: bo-grease
        range: [48, 49]
        text: >-
          Fire Grease. Put it on something and go and use it.
        tags: [boon, item]
      - id: bo-prawn
        range: [50, 50]
        text: >-
          Boiled Prawn. Small, and it has saved better runners than
          you.
        tags: [boon, item]
      - id: bo-warming
        range: [51, 51]
        text: >-
          A Warming Stone, for whatever the next stretch does to
          you.
        tags: [boon, item]
      - id: bo-medallion
        range: [52, 52]
        text: >-
          A Crimson Amber Medallion. Wear it or sell it.
        tags: [boon, item]
      - id: bo-cerulean
        range: [53, 53]
        text: >-
          A Cerulean Crystal Tear, for the flask you keep
          forgetting.
        tags: [boon, item]
      - id: bo-opaline
        range: [54, 54]
        text: >-
          An Opaline Bubbletear. One hit that will not land.
        tags: [boon, item]
      - id: bo-mend
        range: [55, 59]
        text: >-
          You are made whole. Health, focus and flasks, all back.
        tags: [boon, blessing]
      - id: bo-heal
        range: [60, 64]
        text: >-
          Healed to full, where you stand.
        tags: [boon, blessing]
      - id: bo-wind
        range: [65, 69]
        text: >-
          The next stretch costs you no stamina.
        tags: [boon, blessing]
        grants: [blessed-wind]
      - id: bo-focus
        range: [70, 71]
        text: >-
          The next stretch costs you no focus.
        tags: [boon, blessing]
        grants: [blessed-focus]
      - id: bo-sharp
        range: [72, 76]
        text: >-
          Your weapons bite. Double damage until the stretch is out.
        tags: [boon, blessing]
        grants: [blessed-sharp]
      - id: bo-tough
        range: [77, 78]
        text: >-
          Nothing hurts as much. Half damage until the stretch is
          out.
        tags: [boon, blessing]
        grants: [blessed-tough]
      - id: bo-luck
        range: [79, 80]
        text: >-
          Everything drops what it is carrying, for a while.
        tags: [boon, blessing]
        grants: [blessed-luck]
      - id: bo-quiet
        range: [81, 82]
        text: >-
          Nothing hears you for the rest of the stretch.
        tags: [boon, blessing]
        grants: [blessed-quiet]
      - id: bo-mending
        range: [83, 84]
        text: >-
          You mend as you walk, for the rest of the stretch.
        tags: [boon, blessing]
        grants: [blessed-mend]
      - id: bo-keep
        range: [85, 85]
        text: >-
          Whatever happens next, it will not cost you runes.
        tags: [boon, blessing]
        grants: [blessed-keep]
      - id: bo-horse
        range: [86, 86]
        text: >-
          Torrent comes when called, anywhere, for the rest of the
          stretch.
        tags: [boon, blessing]
        grants: [blessed-horse]
      - id: bo-swift
        range: [87, 88]
        text: >-
          You are quick. A quarter faster for the rest of the
          stretch.
        tags: [boon, blessing]
        grants: [blessed-swift]
      - id: bo-peace
        range: [89, 90]
        text: >-
          Nothing will raise a hand to you for the rest of the
          stretch.
        tags: [boon, blessing]
        grants: [blessed-peace]
      - id: bo-still
        range: [91, 92]
        text: >-
          Nothing moves from where it stands, for the rest of the
          stretch.
        tags: [boon, blessing]
        grants: [blessed-still]
      - id: bo-asleep
        range: [93, 93]
        text: >-
          Nothing is thinking about you at all any more.
        tags: [boon, blessing]
        grants: [blessed-sleep]
      - id: bo-stocked
        range: [94, 95]
        text: >-
          Your pouch does not empty for the rest of the stretch.
        tags: [boon, blessing]
        grants: [blessed-stock]
      - id: bo-quiver
        range: [96, 96]
        text: >-
          Your quiver does not empty for the rest of the stretch.
        tags: [boon, blessing]
        grants: [blessed-ammo]
      - id: bo-anchored
        range: [97, 98]
        text: >-
          Nothing staggers you for the rest of the stretch.
        tags: [boon, blessing]
        grants: [blessed-poise]
      - id: bo-unseen
        range: [99, 99]
        text: >-
          Nothing sees you for the rest of the stretch.
        tags: [boon, blessing]
        grants: [blessed-unseen]
      - id: bo-lethal
        range: [100, 100]
        text: >-
          For the rest of this stretch, anything you hit dies.
        tags: [boon, blessing]
        grants: [blessed-lethal]

  displacement:
    resolution: lookup
    title: Displacement
    description: >-
      Every fourth stretch the Lands Between are done with you where
      you are. Drawn as a stretch closes and taken before the next
      one opens. A tool does the moving: these are real places by
      name, and most of them are somewhere you would not have
      chosen.
    roll: d100
    entries:
      - id: dis-elleh
        range: [1, 5]
        text: >-
          Church of Elleh, Limgrave. The ruined church at the
          crossroads. A gentle place to be dropped.
        tags: [displacement]
      - id: dis-first
        range: [6, 10]
        text: >-
          The First Step, Limgrave. The cliff you started on. Begin
          again from here.
        tags: [displacement]
      - id: dis-gatefront
        range: [11, 15]
        text: >-
          Gatefront, Limgrave. The ruins at the gate, and the road
          north.
        tags: [displacement]
      - id: dis-artist
        range: [16, 19]
        text: >-
          Artist's Shack, Limgrave. A hut, a view, and something
          unpleasant nearby.
        tags: [displacement]
      - id: dis-pilgrim
        range: [20, 23]
        text: >-
          Church of Pilgrimage, Weeping Peninsula. South, past the
          bridge, in the rain.
        tags: [displacement]
      - id: dis-morne
        range: [24, 26]
        text: >-
          Castle Morne Rampart, Weeping Peninsula. The castle on the
          cliff, and the sea below it.
        tags: [displacement]
      - id: dis-cliffs
        range: [27, 31]
        text: >-
          Lake-Facing Cliffs, Liurnia of the Lakes. The long lift
          down, and the lake in front of you.
        tags: [displacement]
      - id: dis-shore
        range: [32, 35]
        text: >-
          Liurnia Lake Shore, Liurnia of the Lakes. Ankle deep, a
          long way from anywhere.
        tags: [displacement]
      - id: dis-scenic
        range: [36, 38]
        text: >-
          Scenic Isle, Liurnia of the Lakes. A small island. It is
          not as safe as it looks.
        tags: [displacement]
      - id: dis-stormveil
        range: [39, 42]
        text: >-
          Stormveil Main Gate, Stormveil Castle. At the gate of the
          castle, ready or not.
        tags: [displacement]
      - id: dis-gateside
        range: [43, 45]
        text: >-
          Gateside Chamber, Stormveil Castle. Inside the walls. Do
          not be seen.
        tags: [displacement]
      - id: dis-altus
        range: [46, 49]
        text: >-
          Altus Plateau, Altus Plateau. Up on the golden plateau, in
          the open.
        tags: [displacement]
      - id: dis-erdtree
        range: [50, 52]
        text: >-
          Erdtree-Gazing Hill, Altus Plateau. The hill with the
          view. Everything can see you too.
        tags: [displacement]
      - id: dis-windmill
        range: [53, 55]
        text: >-
          Windmill Village, Altus Plateau. The village with the
          dancing. Keep walking.
        tags: [displacement]
      - id: dis-smoulder
        range: [56, 59]
        text: >-
          Smoldering Church, Caelid. Caelid. It is red, and
          something is already coming.
        tags: [displacement]
      - id: dis-rotview
        range: [60, 62]
        text: >-
          Rotview Balcony, Caelid. Looking out over the rot, close
          enough to smell.
        tags: [displacement]
      - id: dis-dragon
        range: [63, 64]
        text: >-
          Cathedral of Dragon Communion, Caelid. The cathedral on
          the beach, and the hearts in it.
        tags: [displacement]
      - id: dis-gelmir
        range: [65, 67]
        text: >-
          Bridge of Iniquity, Mt. Gelmir. The mountain road, and the
          drop beside it.
        tags: [displacement]
      - id: dis-seethe
        range: [68, 69]
        text: >-
          Seethewater River, Mt. Gelmir. Magma, and things that live
          in magma.
        tags: [displacement]
      - id: dis-siofra
        range: [70, 72]
        text: >-
          Siofra River Bank, Siofra River. Underground, under the
          false stars.
        tags: [displacement]
      - id: dis-worship
        range: [73, 74]
        text: >-
          Worshippers' Woods, Siofra River. The woods below, where
          the drums are.
        tags: [displacement]
      - id: dis-ainsel
        range: [75, 77]
        text: >-
          Ainsel River Sluice Gate, Ainsel River. Deeper
          underground, where the ants are.
        tags: [displacement]
      - id: dis-volcano
        range: [78, 79]
        text: >-
          Volcano Manor, Volcano Manor. Inside the manor. They are
          polite until they are not.
        tags: [displacement]
      - id: dis-eiglay
        range: [80, 81]
        text: >-
          Temple of Eiglay, Volcano Manor. Deep in the manor, above
          the lava.
        tags: [displacement]
      - id: dis-zamor
        range: [82, 84]
        text: >-
          Zamor Ruins, Mountaintops of the Giants. Snow, and the
          ruins, and the cold.
        tags: [displacement]
      - id: dis-freezing
        range: [85, 86]
        text: >-
          Freezing Lake, Mountaintops of the Giants. The ice.
          Something large lives on it.
        tags: [displacement]
      - id: dis-rot
        range: [87, 88]
        text: >-
          Lake of Rot Shoreside, Lake of Rot. The worst lake there
          is. Move fast.
        tags: [displacement]
      - id: dis-shunning
        range: [89, 90]
        text: >-
          Underground Roadside, Subterranean Shunning-Grounds. Under
          the capital, in the sewer.
        tags: [displacement]
      - id: dis-deeproot
        range: [91, 92]
        text: >-
          Root-Facing Cliffs, Deeproot Depths. The roots, a very
          long way down.
        tags: [displacement]
      - id: dis-snowfield
        range: [93, 94]
        text: >-
          Consecrated Snowfield, Consecrated Snowfield. A whiteout.
          You cannot see what is walking towards you.
        tags: [displacement]
      - id: dis-ordina
        range: [95, 96]
        text: >-
          Ordina- Liturgical Town, Consecrated Snowfield. The empty
          town with the lights, which is not empty.
        tags: [displacement]
      - id: dis-farum
        range: [97, 97]
        text: >-
          Crumbling Beast Grave, Crumbling Farum Azula. The end of
          the world, falling upward.
        tags: [displacement]
      - id: dis-table
        range: [98, 98]
        text: >-
          Table of Lost Grace, Roundtable Hold. A mercy. The
          Roundtable, and a moment to breathe.
        tags: [displacement]
      - id: dis-sky
        range: [99, 100]
        text: >-
          The sky. You are lifted a few hundred feet above wherever
          you were standing, and then you are not lifted any more.
        tags: [displacement, fall]

moves:
  # The two things only the player knows. The app cannot see the game, so
  # settling a target is something you say, and saying it is what a boon
  # is drawn on.
  #
  # Both are one racer's. On a board with four names, "I died" is four
  # different things and the run cannot tell which without being told,
  # so each is offered once per name and counts against the one who
  # pressed it. In a run with nobody on the board they are the table's,
  # which is every solo run of this pack.
  # The one thing only the player knows, in a run with nobody on a
  # board. Where there is a roster the moderator awards the target
  # instead, which says the same thing and says who, so this is dropped
  # from that mode rather than offered beside it.
  settled:
    label: I settled it
    when: anytime
    description: The target is done. Draw what it was worth.
    available:
      - { unitIndex: { gte: 1 } }
    do:
      - { do: rollOn, table: boon }

  died:
    label: I died
    when: anytime
    per: contestant
    description: Count it. Nothing else happens; dying is its own punishment.
    do:
      - { do: modCounter, counter: deaths, by: 1 }

phases:
  - id: meddle
    label: Interference
    steps:
      - kind: rollTable
        table: interference
        label: Draw what is wrong with the world
      - kind: rollTable
        table: interference
        label: Draw a second interference
        skipWhen:
          - { resource: interferences, is: { lte: 1 } }
      - kind: rollTable
        table: interference
        label: Draw a third interference
        skipWhen:
          - { resource: interferences, is: { lte: 2 } }
      - kind: rollTable
        table: interference
        label: Draw a fourth interference
        skipWhen:
          - { resource: interferences, is: { lte: 3 } }

  # One roll a target. A step that is not wanted skips itself on the
  # dial rather than being queued by something the player has to press,
  # which is what these were before and it showed.
  - id: charge
    label: Target
    steps:
      - kind: rollTable
        table: target
        label: Draw what the stretch is for
      - kind: rollTable
        table: target
        label: Draw a second target
        skipWhen:
          - { resource: targets, is: { lte: 1 } }
      - kind: rollTable
        table: target
        label: Draw a third target
        skipWhen:
          - { resource: targets, is: { lte: 2 } }
      - kind: rollTable
        table: target
        label: Draw a fourth target
        skipWhen:
          - { resource: targets, is: { lte: 3 } }
      - kind: declareSubject
        constrainedBy: target
        label: Name what you are going for, or take the words the dice used.

  - id: play
    label: Play
    steps:
      - kind: manual
        label: Play the stretch. Stop when the clock does.
        description: >-
          Ten minutes. The interference is the rule and the target is the
          point; getting neither done is an ordinary outcome. Settle the
          target and say so, and the land pays you for it. If you die,
          say that too; it is only counted.
        checklist:
          - text: The interference is in force.
            shows: { table: interference, scope: unit }
          - text: The target was named, and settled or not.
            shows: { table: target, scope: unit }
          - text: If you settled it, you said so and took the boon.
            shows: { table: boon, scope: unit }
          - text: You were moved, if the land said so.
            shows: { table: displacement, scope: unit }

  - id: close
    label: End the stretch
    steps:
      - kind: finalizeUnit
        label: End the stretch

endings:
  - id: stop
    label: Call it
    text: The Interference ends. What you got through, you got through.
  - id: ten
    label: Ten stretches
    text: Ten stretches, and the world never did settle down.
    requires:
      - { counter: stretches, is: { gte: 10 } }

modes:
  solo:
    label: Solo
    description: Three to twenty stretches, one player, ten minutes each.
    units: { min: 3, max: 20 }

  short:
    label: An hour
    description: Six stretches. An hour of play, near enough, and then it is over.
    units: { fixed: 6 }

  seeded:
    label: Seeded
    description: The same stretches in the same order from one seed, so two people can run it against each other.
    seeded: true
    units: { fixed: 6 }

  party:
    label: Everyone at once
    description: >-
      One person draws and everybody plays it, each on their own copy, and
      the interference lands on every runner at the same moment. The harsh
      draws are worth points; award them to whoever got through the
      stretch under one. A mercy is worth nothing, which is fair.
    units: { min: 3, max: 20 }
    # Awarding a target is how a race says somebody settled it, so that
    # is where the boon is drawn and it is drawn for them. The move that
    # said the same thing is gone from this mode: two ways to declare
    # one thing meant the boon was the run's rather than the winner's,
    # and the second press was the one nobody remembered.
    disable:
      moves: [settled]
    moderated:
      contestants: { min: 2, max: 8 }
      award: everyone
      onAward:
        - { do: rollOn, table: boon }

defaultMode: solo

hierarchy:
  - Boon
  - Displacement
  - Interference
  - General rules

fixtures:
  - name: An interference lands, holds for the stretch, and is gone by the next one
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: interference, entryId: in-root, cause: phase }
      - { t: StateApplied, state: rooted }
      - { t: UnitFinalized }
      - { t: UnitEntered }
      - { t: OutcomeResolved, table: interference, entryId: in-calm, cause: phase }
    expect:
      - { path: counters.stretches, equals: 1 }
      - { path: runStates.length, equals: 0 }
      - { path: outcomes.length, equals: 2 }

  - name: Four stretches in one place leaves a displacement owed
    mode: solo
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: A quiet corner }
      - { step: "play#0" }
      - { finalize: {} }
      - { enter: 2 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: A quiet corner }
      - { step: "play#0" }
      - { finalize: {} }
      - { enter: 3 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: A quiet corner }
      - { step: "play#0" }
      - { finalize: {} }
      - { enter: 4 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: A quiet corner }
      - { step: "play#0" }
      - { finalize: {} }
    expect:
      - { path: counters.stretches, equals: 4 }
      # Owed, not taken: a threshold is put in front of the player, since
      # firing it means rolling, and the reducer cannot roll.
      - { path: counters.wander, equals: 4 }
      - { path: outcomes.length, equals: 8 }
      - { requests: answered }

  - name: Taking the displacement moves you on and starts the count again
    mode: solo
    events:
      - { t: RunStarted, mode: solo }
      - { t: UnitEntered }
      - { t: CounterChanged, counter: wander, by: 4 }
      - { t: OutcomeResolved, table: displacement, entryId: dis-grace, cause: action }
      - { t: CounterChanged, counter: wander, set: 0 }
      - { t: TriggerFired, key: "counter:wander:0:u1" }
    expect:
      - { path: counters.wander, equals: 0 }
      - { path: outcomes.0.entryId, equals: dis-grace }
      - { path: firedOnce, contains: "counter:wander:0:u1" }

  - name: At one apiece, a stretch draws one of each and asks for nothing
    mode: solo
    # The proof that the dials work is that this script runs at all. If
    # the second, third and fourth rolls did not skip themselves, the
    # declare would fail: the run would be waiting on meddle#1 rather
    # than on a name. Nothing is pressed and nothing is owed.
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: The camp on the ridge }
    expect:
      - { path: outcomes.length, equals: 2 }
      - { path: outcomes.0.table, equals: interference }
      - { path: outcomes.1.table, equals: target }
      - { path: resources.interferences, equals: 1 }
      - { path: resources.targets, equals: 1 }
      - { requests: answered }

  - name: A result that asks for more targets gets them without being pressed
    mode: solo
    # ta-two rolls the table again from its own trigger, which is not
    # the same machinery as the dial and needs its own answer.
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: [93, 1] } }
      - { declare: Both of them }
    expect:
      - { path: outcomes.0.entryId, equals: in-calm }
      - { path: outcomes.1.entryId, equals: ta-two }
      - { path: outcomes.length, equals: 3 }
      - { requests: answered }

  - name: Settling a target pays, and the boon is drawn on the word of the player
    mode: solo
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { step: "charge#0", answers: { d100: 98 } }
      - { declare: The camp on the ridge }
      - { move: settled, answers: { d100: 1 } }
    expect:
      # Two draws for the stretch, and a third because the target was
      # settled: nothing but the player could have told it that.
      - { path: outcomes.length, equals: 3 }
      - { path: outcomes.2.table, equals: boon }
      - { requests: answered }

  - name: A death is counted and nothing else happens
    mode: solo
    play:
      - { enter: 1 }
      - { step: "meddle#0", answers: { d100: 100 } }
      - { move: died }
      - { move: died }
    expect:
      - { path: counters.deaths, equals: 2 }
      - { path: runStates.length, equals: 0 }
