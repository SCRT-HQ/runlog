<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Runlog">
  <!-- Four squares: a run is a sequence of units, and one of them went wrong. -->
  <rect width="512" height="512" rx="96" fill="#0d0f12"/>
  <g fill="#7dd3a0">
    <rect x="112" y="112" width="128" height="128" rx="20"/>
    <rect x="272" y="112" width="128" height="128" rx="20" opacity="0.55"/>
    <rect x="112" y="272" width="128" height="128" rx="20" opacity="0.55"/>
  </g>
  <rect x="272" y="272" width="128" height="128" rx="20" fill="none" stroke="#e0b355" stroke-width="18"/>
</svg>
