<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the run's rail can sit on the foot of a phone
         with a notch and still keep its buttons clear of it; every fixed
         edge in the sheet pads itself with the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Runlog</title>
    <meta
      name="description"
      content="A referee and run log for dice-driven creative-practice games. Everything stays on your machine."
    />
    <!-- Relative so the same build works from a static host and from disk. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <!-- The browser's own chrome takes the ground of the theme it is showing:
         the studio with the lights down, or daylight. Any other value leaves a
         band of a color that is in none of the four looks. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151311" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#edeae2" />
    <!-- hosted:head -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
