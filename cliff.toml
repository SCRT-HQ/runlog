# How a release's notes are put together from the commits in it.
#
# Every merge to main is one squash commit titled with the pull request's
# title, in Conventional Commits form (see CONTRIBUTING.md, "Releases").
# git-cliff reads those titles, groups them by type, and writes the notes
# a release carries and the CHANGELOG.md attached to it. The type also
# decides the size of the version bump, in the CI workflow's version step.

[changelog]
header = """
# Changelog

Every release, newest first. Each line is a pull request; the type in
front of it is what decided the version.
"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }}: {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (breaking){% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# A title that is not conventional still lands in the notes, under
# "Everything else", rather than vanishing: every merge is a change.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
# The squash commit's title ends in "(#N)"; make that a link to the pull request.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/SCRT-HQ/runlog/pull/${1}))" },
]
# The order here is the order in the notes: the <n> prefix sorts, and is stripped.
commit_parsers = [
  { message = "^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\\(.*\\))?!", group = "<0>Breaking changes" },
  { body = "BREAKING CHANGE", group = "<0>Breaking changes" },
  { message = "^feat", group = "<1>New" },
  { message = "^fix", group = "<2>Fixed" },
  { message = "^perf", group = "<3>Faster" },
  { message = "^docs", group = "<4>Documentation" },
  { message = "^(build|chore)\\(deps", group = "<5>Dependencies" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(refactor|style|test|build|ci|chore|revert)", group = "<6>Housekeeping" },
  { message = ".*", group = "<7>Everything else" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
